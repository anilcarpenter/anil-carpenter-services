">

</p>



<p>

<label for="confirmPassword">

</label>

</p>


<p>

<input
type="password"
id="confirmPassword"
placeholder="Password दोबारा लिखें"
required
minlength="6"
style="
width:100%;
padding:12px;
border:1px solid #dadce0;
border-radius:6px;
">

</p>

id="resetMessage"
style="
margin:12px 0;

">

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://dvfbprtvuthzojbxaoua.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_FsFay7fTJSIS6LNDyjbmVA_cSEVSpJg";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);



const resetPasswordForm =
document.getElementById(
"resetPasswordForm"
);


const resetBtn =
document.getElementById(
"resetBtn"
);


const resetMessage =
document.getElementById(
"resetMessage"
);



resetPasswordForm.addEventListener(
"submit",
async function(e){

e.preventDefault();


const password =
document
.getElementById("password")
.value;


const confirmPassword =
document
.getElementById("confirmPassword")
.value;



if(password.length < 6){

resetMessage.textContent =
"❌ Password कम से कम 6 characters का होना चाहिए।";

resetMessage.style.color =
"red";

return;

}



if(password !== confirmPassword){

resetMessage.textContent =
"❌ दोनों Password एक जैसे नहीं हैं।";

resetMessage.style.color =
"red";

return;

}



resetBtn.disabled = true;

resetBtn.textContent =
"⏳ Password बदला जा रहा है...";

resetMessage.textContent = "";



const { error } =
await supabaseClient.auth
.updateUser({

password: password

});



if(error){

resetMessage.textContent =
"❌ " + error.message;

resetMessage.style.color =
"red";

resetBtn.disabled = false;

resetBtn.textContent =
"🔐 Password बदलें";

return;

}



resetMessage.textContent =
"✅ Password सफलतापूर्वक बदल दिया गया!";

resetMessage.style.color =
"green";


resetBtn.textContent =
"✅ Password बदल गया";


setTimeout(function(){

window.location.href =
"login.html";

},1500);


});

</script>


</body>
