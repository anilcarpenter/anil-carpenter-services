/* =====================================================
   SAVE PROFILE
   FIRESTORE ONLY
   NO FIREBASE STORAGE
===================================================== */

async function saveProfile(){


  /* =========================
     GET FORM VALUES
  ========================= */

  const name =
  nameInput.value.trim();


  let username =
  usernameInput.value
  .trim()
  .toLowerCase()
  .replace(
    /[^a-z0-9_]/g,
    ""
  );


  const bio =
  bioInput.value.trim();


  const location =
  locationInput.value.trim();


  /* =========================
     VALIDATION
  ========================= */

  if(!name){

    showMessage(
      "❌ नाम लिखें"
    );

    return;

  }


  if(!username){

    showMessage(
      "❌ Username लिखें"
    );

    return;

  }


  /* =========================
     BUTTON LOADING
  ========================= */

  saveBtn.disabled =
  true;


  saveBtn.textContent =
  "⏳ Saving...";


  try{


    /* =========================
       LOAD OLD PROFILE
    ========================= */

    const oldProfile =
    await getDoc(
      doc(
        db,
        "users",
        userId
      )
    );


    let photo =
    null;


    /* =========================
       KEEP OLD PHOTO
    ========================= */

    if(
      oldProfile.exists()
    ){

      photo =
      oldProfile.data().photo_url ||
      null;

    }


    /* =========================
       NEW PHOTO
    ========================= */

    if(
      photoInput.files[0]
    ){

      const file =
      photoInput.files[0];


      /* FILE CHECK */

      if(
        !file.type.startsWith("image/")
      ){

        throw new Error(
          "कृपया केवल Image चुनें"
        );

      }


      /* =========================
         COMPRESS PHOTO
      ========================= */

      const compressedPhoto =
      await compressImage(
        file
      );


      /* =========================
         CONVERT PHOTO TO DATA URL
      ========================= */

      photo =
      await blobToDataURL(
        compressedPhoto
      );


      /* =========================
         FIRESTORE SIZE CHECK
      ========================= */

      if(
        photo.length >
        700000
      ){

        throw new Error(
          "Photo अभी भी बड़ी है। कृपया छोटी Photo चुनें।"
        );

      }

    }


    /* =========================
       SAVE TO FIRESTORE
    ========================= */

    await setDoc(
      doc(
        db,
        "users",
        userId
      ),
      {

        user_id:
        userId,

        full_name:
        name,

        username:
        username,

        bio:
        bio,

        location:
        location,

        photo_url:
        photo,

        updated_at:
        serverTimestamp()

      },
      {
        merge:true
      }
    );


    /* =========================
       SUCCESS
    ========================= */

    showMessage(
      "✅ Profile Save हो गई"
    );


    /* CLEAR PHOTO INPUT */

    photoInput.value =
    "";


    /* CLOSE EDIT BOX */

    editBox.style.display =
    "none";


    /* RELOAD PROFILE */

    await loadProfile();


  }
  catch(error){


    console.error(
      "PROFILE SAVE ERROR:",
      error
    );


    let errorText =
    error.message ||
    "Unknown error";


    /* =========================
       FRIENDLY FIREBASE ERROR
    ========================= */

    if(
      errorText.includes(
        "permission-denied"
      )
    ){

      errorText =
      "Firebase Permission Denied. Firestore Rules check करें.";

    }


    if(
      errorText.includes(
        "network"
      )
    ){

      errorText =
      "Internet connection check करें.";

    }


    if(
      errorText.includes(
        "quota"
      )
    ){

      errorText =
      "Firebase quota limit पूरी हो गई है.";

    }


    showMessage(
      "❌ " +
      errorText
    );


  }
  finally{


    saveBtn.disabled =
    false;


    saveBtn.textContent =
    "💾 Profile Save करें";


  }

}


/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(file){

  return new Promise(
    function(resolve,reject){


      const reader =
      new FileReader();


      reader.onload =
      function(){


        const img =
        new Image();


        img.onload =
        async function(){


          try{


            /* =========================
               MAX IMAGE SIZE
            ========================= */

            const maxSize =
            550;


            let width =
            img.width;


            let height =
            img.height;


            /* =========================
               RESIZE
            ========================= */

            if(
              width > height
            ){

              if(
                width > maxSize
              ){

                height =
                Math.round(
                  height *
                  maxSize /
                  width
                );

                width =
                maxSize;

              }

            }
            else{

              if(
                height > maxSize
              ){

                width =
                Math.round(
                  width *
                  maxSize /
                  height
                );

                height =
                maxSize;

              }

            }


            /* =========================
               CANVAS
            ========================= */

            const canvas =
            document.createElement(
              "canvas"
            );


            canvas.width =
            width;


            canvas.height =
            height;


            const ctx =
            canvas.getContext(
              "2d"
            );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            /* =========================
               COMPRESS
            ========================= */

            canvas.toBlob(
              function(blob){

                if(blob){

                  resolve(blob);

                }
                else{

                  reject(
                    new Error(
                      "Photo compression failed"
                    )
                  );

                }

              },
              "image/jpeg",
              0.55
            );


          }
          catch(error){

            reject(
              error
            );

          }

        };


        img.onerror =
        function(){

          reject(
            new Error(
              "Image load failed"
            )
          );

        };


        img.src =
        reader.result;

      };


      reader.onerror =
      function(){

        reject(
          new Error(
            "File read failed"
          )
        );

      };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
   BLOB TO DATA URL
===================================================== */

function blobToDataURL(blob){

  return new Promise(
    function(resolve,reject){


      const reader =
      new FileReader();


      reader.onload =
      function(){

        resolve(
          reader.result
        );

      };


      reader.onerror =
      function(){

        reject(
          new Error(
            "Photo conversion failed"
          )
        );

      };


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{


    const snap =
    await getDoc(
      doc(
        db,
        "users",
        userId
      )
    );


    /* =========================
       PROFILE EXISTS
    ========================= */

    if(
      snap.exists()
    ){


      const data =
      snap.data();


      /* NAME */

      profileName.textContent =
      data.full_name ||
      "Carpenter";


      /* USERNAME */

      profileUsername.textContent =
      "@" +
      (
        data.username ||
        "carpenter"
      );


      /* BIO */

      profileBio.textContent =
      data.bio ||
      "Carpenter Community Member";


      /* LOCATION */

      profileLocation.textContent =
      data.location
      ?
      "📍 " +
      data.location
      :
      "📍 Location not added";


      /* PHOTO */

      if(
        data.photo_url
      ){

              profilePhoto.src =
        data.photo_url;

      }
      else{

        profilePhoto.src =
        defaultPhoto;

      }


      /* EDIT VALUES */

      nameInput.value =
      data.full_name ||
      "";


      usernameInput.value =
      data.username ||
      "";


      bioInput.value =
      data.bio ||
      "";


      locationInput.value =
      data.location ||
      "";

    }

    else{

      profilePhoto.src =
      defaultPhoto;


      nameInput.value =
      "Carpenter";


      usernameInput.value =
      "carpenter";


      bioInput.value =
      "Carpenter Community Member";


      locationInput.value =
      "";

    }


    await loadStats();


    await loadUserPosts();

  }
  catch(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );


    showMessage(
      "Profile load नहीं हुई"
    );

  }

}

  try{

    const followersSnapshot =
    await getDocs(
      collection(
        db,
        "users",
        userId,
        "followers"
      )
    );


    const followingSnapshot =
    await getDocs(
      collection(
        db,
        "users",
        userId,
        "following"
      )
    );


    followersCount.textContent =
    followersSnapshot.size;


    followingCount.textContent =
    followingSnapshot.size;

  }
  catch(error){

    console.error(
      "STATS ERROR:",
      error
    );

  }

}


/* =========================
   USER POSTS
========================= */

async function loadUserPosts(){

  try{

    const postsRef =
    collection(
      db,
      "community_posts"
    );


    const q =
    query(
      postsRef,
      where(
        "user_id",
        "==",
        userId
      )
    );


    const snapshot =
    await getDocs(q);


    postsCount.textContent =
    snapshot.size;


    if(
      snapshot.empty
    ){

      userPosts.innerHTML = `

        <div class="empty">

          📸

          <p style="margin-top:8px;">
            अभी कोई Post नहीं है।
          </p>

        </div>

      `;

      return;

    }


    userPosts.innerHTML =
    "";


    snapshot.forEach(
      function(postDoc){

        const post =
        postDoc.data();


        const card =
        document.createElement(
          "div"
        );


        card.className =
        "post-card";


        if(
          post.post_text
        ){

          const text =
          document.createElement(
            "div"
          );


          text.className =
          "post-text";


          text.textContent =
          post.post_text;


          card.appendChild(
            text
          );

        }


        if(
          post.image_url
        ){

          const image =
          document.createElement(
            "img"
          );


          image.className =
          "post-image";


          image.src =
          post.image_url;


          image.alt =
          "Carpenter Post";


          image.loading =
          "lazy";


          card.appendChild(
            image
          );

        }


        userPosts.appendChild(
          card
        );

      }
    );

  }
  catch(error){

    console.error(
      "POSTS ERROR:",
      error
    );


    userPosts.innerHTML = `

      <div class="empty">

        ⚠️

        <p style="margin-top:8px;">
          Posts load नहीं हो सके।
        </p>

      </div>

    `;

  }

}

followBtn.addEventListener(

  async function(){

    showMessage(
      "Follow system अगले Step में जोड़ेंगे"

/* =========================
   MESSAGE
========================= */

function showMessage(text){

  message.textContent =
  text;


  message.style.display =
  "block";


  setTimeout(
    function(){

      message.style.display =
      "none";

    },
    3000
  );

}
