<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anil Carpenter Profile</title>
  
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111827;
}
.header{
  height:58px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  font-size:18px;
  font-weight:bold;
}
.header b{color:#f59e0b}

.profile{
  background:white;
  text-align:center;
  padding:25px 15px 18px;
}
.photo{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #f59e0b;
}
.name{font-size:25px;font-weight:800;margin-top:12px}
.username{color:#6b7280;margin-top:4px}
.bio{margin:15px auto 5px;max-width:400px;color:#374151}
.location{color:#6b7280;margin:8px}

.stats{
  display:flex;
  justify-content:center;
  gap:45px;
  margin:22px 0;
}
.stats b{display:block;font-size:21px}
.stats span{color:#6b7280;font-size:13px}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 20px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.follow{background:#f59e0b}
.message{background:#e5e7eb}
.edit{background:#111827;color:white}

.tabs{
  display:flex;
  background:white;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
}
.tabs button{
  flex:1;
  background:white;
  border-radius:0;
  padding:15px 5px;
}

.content{
  padding:20px;
}
.post{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:12px;
}
  .menu-btn{
  background:transparent;
  border:0;
  color:white;
  font-size:25px;
  cursor:pointer;
  padding:5px 8px;
  }
  /* =========================
   SIDE MENU
========================= */

.side-menu{
  position:fixed;
  top:0;
  right:-330px;
  width:310px;
  max-width:88%;
  height:100vh;
  background:#ffffff;
  z-index:9999;
  overflow-y:auto;
  box-shadow:-5px 0 20px rgba(0,0,0,.20);
  transition:right .25s ease;
}

.side-menu.active{
  right:0;
}

.menu-header{
  position:sticky;
  top:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 16px;
  background:#111827;
  color:#ffffff;
  font-size:19px;
  z-index:2;
}

.menu-header button{
  background:transparent;
  color:#ffffff;
  border:0;
  font-size:20px;
  padding:5px 8px;
  cursor:pointer;
}

.menu-section{
  padding:10px 10px 4px;
  border-bottom:1px solid #eeeeee;
}

.menu-title{
  padding:10px 12px 6px;
  color:#6b7280;
  font-size:13px;
  font-weight:bold;
}

.menu-section > button{
  display:block;
  width:100%;
  text-align:left;
  background:#ffffff;
  border:0;
  border-radius:10px;
  padding:13px 12px;
  margin:2px 0;
  font-size:15px;
  font-weight:500;
  color:#111827;
  cursor:pointer;
}

.menu-section > button:hover{
  background:#f3f4f6;
}

@media(max-width:500px){
  .side-menu{
    width:300px;
  }
}
</style>
</head>

<body>

<div class="header">
  <span>🪚 <b>Anil</b> Carpenter</span>

  <div style="display:flex;gap:8px;align-items:center;">
    <a href="profile.html"
       style="text-decoration:none;color:white;border:1px solid #4b5563;border-radius:10px;padding:9px 14px;font-weight:bold;">
       👤 Profile
    </a>

    <button class="menu-btn" type="button" onclick="openMenu()">☰</button>
  </div>
</div>

<section class="profile">

  <img class="photo"
       src="https://picsum.photos/200">

  <div class="name">Anil Carpenter</div>
  <<div class="username"
     id="profileUsername"
     onclick="createAccount()">
  @anilcarpenter
</div>

  <div class="bio">
    Furniture Work.<br>
    Pachpokhari Bazar SK Nagar
  </div>

  <div class="location">📍 Khalilabad, Sant Kabir Nagar</div>

  <div class="stats">
    <div><b>40</b><span>Posts</span></div>
    <div><b>5425</b><span>Followers</span></div>
    <div><b>52</b><span>Following</span></div>
  </div>

  <div class="buttons">
    <button class="follow" onclick="follow()">➕ Follow</button>
    <button class="message" onclick="message()">💬 Message</button>
    <button class="edit" onclick="edit()">✏️ Edit Profile</button>
  </div>

</section>

<div class="tabs">
  <button onclick="tab('Posts')">📷 Posts</button>
  <button onclick="tab('Reels')">🎬 Reels</button>
  <button onclick="tab('Threads')">✏️ Threads</button>
  <button onclick="tab('Story')">⭕ Story</button>
</div>

<div class="content" id="content">
  <div class="post">
    📷 <b>Posts</b>
    <p>यहाँ user की posts दिखाई देंगी।</p>
  </div>
</div>

<script>
  function createAccount(){
  alert("✨ Create Account\n\nअपना नया Carpenter Community Account बनाइए।");
  }
function follow(){
  alert("Follow system यहाँ खुलेगा");
}

function message(){
  alert("Message box यहाँ खुलेगा");
}

function edit(){
  alert("Edit Profile यहाँ खुलेगा");
}

function tab(name){
  document.getElementById("content").innerHTML =
    "<div class='post'><h3>"+name+"</h3><p>"+name+
    " का section यहाँ खुलेगा।</p></div>";
}
  function closeMenu(){
  document.getElementById("sideMenu").classList.remove("active");
}

function openMenu(){
  document.getElementById("sideMenu").classList.add("active");
}
</script>
<!-- MENU PANEL -->
<div id="sideMenu" class="side-menu">

  <div class="menu-header">
    <b>☰ Menu</b>
    <button type="button" onclick="closeMenu()">✕</button>
  </div>

  <div class="menu-section">
    <div class="menu-title">👤 Account</div>

    <button onclick="menuAction('profile')">👤 My Profile</button>
    <button onclick="menuAction('edit')">✏️ Edit Profile</button>
    <button onclick="menuAction('signin')">🔐 Sign In</button>
    <button onclick="menuAction('signup')">🆕 Create Account</button>
  </div>

  <div class="menu-section">
    <div class="menu-title">⚙️ Settings</div>

    <button onclick="menuAction('settings')">⚙️ Settings</button>
    <button onclick="menuAction('notifications')">🔔 Notifications</button>
    <button onclick="menuAction('privacy')">🔒 Privacy</button>
    <button onclick="menuAction('security')">🛡️ Security</button>
  </div>

  <div class="menu-section">
    <div class="menu-title">♿ Accessibility</div>

    <button onclick="menuAction('text')">🔤 Text Size</button>
    <button onclick="menuAction('dark')">🌙 Dark Mode</button>
    <button onclick="menuAction('contrast')">🎨 High Contrast</button>
    <button onclick="menuAction('motion')">🔊 Reduce Motion</button>
  </div>

  <div class="menu-section">
    <div class="menu-title">💰 Community</div>

    <button onclick="menuAction('pro')">⭐ Carpenter Pro</button>
    <button onclick="menuAction('promote')">📢 Promote My Work</button>
    <button onclick="menuAction('business')">🏪 Business Profile</button>
  </div>

  <div class="menu-section">
    <div class="menu-title">❓ Help</div>

    <button onclick="menuAction('guidelines')">📖 Community Guidelines</button>
    <button onclick="menuAction('help')">❓ Help & Support</button>
    <button onclick="menuAction('report')">🚩 Report a Problem</button>
    <button onclick="menuAction('about')">ℹ️ About Anil Carpenter</button>
  </div>

</div>
</body>
</html>
