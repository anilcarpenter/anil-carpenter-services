<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carpenter Profile | Anil Carpenter</title>

<meta name="description"
content="Carpenter Community Profile">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f3f4f6;
  color:#202124;
}

.container{
  width:94%;
  max-width:650px;
  margin:auto;
}

/* HEADER */

.header{
  background:#111827;
  color:white;
  padding:14px 0;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:18px;
  font-weight:800;
}

.logo span{
  color:#f59e0b;
}

.back-btn{
  color:white;
  text-decoration:none;
  border:1px solid #4b5563;
  padding:7px 12px;
  border-radius:8px;
  font-size:13px;
}

/* PROFILE */

.profile{
  background:white;
  padding:28px 18px 24px;
  text-align:center;
}

.profile-photo{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  background:#fde68a;
  border:4px solid #f59e0b;
  display:block;
  margin:0 auto 12px;
}

.profile-name{
  font-size:24px;
  font-weight:800;
}

.username{
  color:#6b7280;
  margin-top:4px;
  font-size:14px;
}

.bio{
  margin:13px auto;
  max-width:480px;
  line-height:1.6;
  color:#374151;
}

.location{
  color:#6b7280;
  font-size:14px;
  margin-bottom:18px;
}

/* STATS */

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:20px 0;
}

.stat{
  text-align:center;
}

.stat-number{
  font-size:20px;
  font-weight:800;
}

.stat-label{
  color:#6b7280;
  font-size:12px;
  margin-top:3px;
}

/* BUTTONS */

.profile-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
}

.profile-buttons button{
  border:0;
  border-radius:9px;
  padding:11px 25px;
  cursor:pointer;
  font-weight:800;
}

.follow-btn{
  background:#f59e0b;
  color:#111827;
}

.edit-btn{
  background:#111827;
  color:white;
}

/* EDIT */

.edit-box{
  display:none;
  background:#f8fafc;
  border-top:1px solid #e5e7eb;
  padding:20px 0 5px;
  margin-top:22px;
  text-align:left;
}

.edit-box label{
  display:block;
  font-weight:700;
  margin:12px 0 6px;
  font-size:13px;
}

.edit-box input,
.edit-box textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:11px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.edit-box textarea{
  min-height:80px;
  resize:vertical;
}

.save-btn{
  width:100%;
  margin-top:16px;
  border:0;
  background:#f59e0b;
  color:#111827;
  padding:12px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.save-btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

/* POSTS */

.posts{
  padding:22px 0 50px;
}

.posts-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:14px;
}

.post-card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-text{
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
  margin-top:12px;
}

.empty{
  background:white;
  border-radius:14px;
  padding:35px 20px;
  text-align:center;
  color:#6b7280;
}

/* MESSAGE */

.message{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:11px 16px;
  border-radius:9px;
  display:none;
  z-index:999;
  font-size:13px;
}

@media(max-width:500px){

  .stats{
    gap:22px;
  }

  .profile-buttons button{
    padding:10px 18px;
  }

}
</style>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  query,
  where,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCKTMSuuxEVj0ZTT9CAJW5NgJ9ynH6Qsto",

  authDomain:
  "anil-carpenter-community.firebaseapp.com",

  projectId:
  "anil-carpenter-community",

  storageBucket:
  "anil-carpenter-community.firebasestorage.app",

  messagingSenderId:
  "835868472367",

  appId:
  "1:835868472367:web:a320614a701cd3bbf102da",

  measurementId:
  "G-BDDMVGQP4T"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const storage =
getStorage(app);


/* =========================
   USER ID
========================= */

let userId =
localStorage.getItem(
  "carpenterUserId"
);


if(!userId){

  userId =
  crypto.randomUUID();

  localStorage.setItem(
    "carpenterUserId",
    userId
  );

}


/* =========================
   ELEMENTS
========================= */

const profilePhoto =
document.getElementById(
  "profilePhoto"
);

const profileName =
document.getElementById(
  "profileName"
);

const profileUsername =
document.getElementById(
  "profileUsername"
);

const profileBio =
document.getElementById(
  "profileBio"
);

const profileLocation =
document.getElementById(
  "profileLocation"
);

const followersCount =
document.getElementById(
  "followersCount"
);

const followingCount =
document.getElementById(
  "followingCount"
);

const postsCount =
document.getElementById(
  "postsCount"
);

const followBtn =
document.getElementById(
  "followBtn"
);

const editBtn =
document.getElementById(
  "editBtn"
);

const editBox =
document.getElementById(
  "editBox"
);

const photoInput =
document.getElementById(
  "photoInput"
);

const nameInput =
document.getElementById(
  "nameInput"
);

const usernameInput =
document.getElementById(
  "usernameInput"
);

const bioInput =
document.getElementById(
  "bioInput"
);

const locationInput =
document.getElementById(
  "locationInput"
);

const saveBtn =
document.getElementById(
  "saveBtn"
);

const userPosts =
document.getElementById(
  "userPosts"
);

const message =
document.getElementById(
  "message"
);


/* =========================
   DEFAULT PHOTO
========================= */

const defaultPhoto =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

<svg xmlns="http://www.w3.org/2000/svg"
width="300"
height="300">

<rect
width="300"
height="300"
fill="#fde68a"
 />

<text
x="150"
y="175"
text-anchor="middle"
font-size="110">
👷
</text>

</svg>

`);


/* =========================
   PHOTO PREVIEW
========================= */

photoInput.addEventListener(
  "change",
  function(){

    const file =
    photoInput.files[0];

    if(!file){
      return;
    }


    if(
      !file.type.startsWith("image/")
    ){

      showMessage(
        "कृपया Image चुनें"
      );

      photoInput.value = "";

      return;
    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

      profilePhoto.src =
      e.target.result;

    };


    reader.readAsDataURL(
      file
    );

  }
);


/* =========================
   EDIT BUTTON
========================= */

editBtn.addEventListener(
  "click",
  function(){

    if(
      editBox.style.display ===
      "block"
    ){

      editBox.style.display =
      "none";

    }else{

      editBox.style.display =
      "block";

    }

  }
);


/* =========================
   SAVE BUTTON
========================= */

saveBtn.addEventListener(
  "click",
  saveProfile
);


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  const name =
  nameInput.value.trim();


  let username =
  usernameInput.value
  .trim()
  .toLowerCase()
  .replace(
    /[^a-z0-9_]/g,
    ""
  );


  const bio =
  bioInput.value.trim();


  const location =
  locationInput.value.trim();


  if(!name){

    showMessage(
      "नाम लिखें"
    );

    return;

  }


  if(!username){

    showMessage(
      "Username लिखें"
    );

    return;

  }


  saveBtn.disabled =
  true;


  saveBtn.textContent =
  "⏳ Saving...";


  try{

    /* =========================
       LOAD OLD PROFILE FIRST
    ========================= */

    const oldProfile =
    await getDoc(
      doc(
        db,
        "users",
        userId
      )
    );


    let oldPhoto = null;


    if(
      oldProfile.exists()
    ){

      oldPhoto =
      oldProfile.data().photo_url ||
      null;

    }


    let photo =
    oldPhoto;


    /* =========================
       NEW PHOTO
    ========================= */

    if(
      photoInput.files[0]
    ){

      const file =
      photoInput.files[0];


      /* FILE TYPE CHECK */

      if(
        !file.type.startsWith("image/")
      ){

        throw new Error(
          "कृपया केवल Image चुनें"
        );

      }


      /* COMPRESS */

      const compressedFile =
      await compressImage(
        file
      );


      /* FIREBASE STORAGE */

      const fileRef =
      ref(
        storage,
        "profile-photos/" +
        userId +
        "/" +
        Date.now() +
        ".jpg"
      );


      await uploadBytes(
        fileRef,
        compressedFile,
        {
          contentType:
          "image/jpeg"
        }
      );


      photo =
      await getDownloadURL(
        fileRef
      );

    }


    /* =========================
       SAVE PROFILE
    ========================= */

    await setDoc(
      doc(
        db,
        "users",
        userId
      ),
      {

        user_id:
        userId,

        full_name:
        name,

        username:
        username,

        bio:
        bio,

        location:
        location,

        photo_url:
        photo,

        updated_at:
        serverTimestamp()

      },
      {
        merge:true
      }
    );


    showMessage(
      "✅ Profile Save हो गई"
    );


    photoInput.value = "";


    editBox.style.display =
    "none";


    await loadProfile();

  }
  catch(error){

    console.error(
      "PROFILE SAVE ERROR:",
      error
    );


    let errorText =
    error.message ||
    "Unknown error";


    if(
      errorText.includes(
        "billing"
      ) ||
      errorText.includes(
        "Billing"
      ) ||
      errorText.includes(
        "storage"
      )
    ){

      errorText =
      "Firebase Storage के लिए Upgrade/Billing जरूरी है";

    }


    showMessage(
      "❌ " +
      errorText
    );

  }
  finally{

    saveBtn.disabled =
    false;


    saveBtn.textContent =
    "💾 Profile Save करें";

  }

}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
      new FileReader();


      reader.onload =
      function(){

        const img =
        new Image();


        img.onload =
        function(){

          const maxSize =
          800;


          let width =
          img.width;


          let height =
          img.height;


          if(
            width > height
          ){

            if(
              width > maxSize
            ){

              height =
              Math.round(
                height *
                maxSize /
                width
              );

              width =
              maxSize;

            }

          }
          else{

            if(
              height > maxSize
            ){

              width =
              Math.round(
                width *
                maxSize /
                height
              );

              height =
              maxSize;

            }

          }


          const canvas =
          document.createElement(
            "canvas"
          );


          canvas.width =
          width;


          canvas.height =
          height;


          const ctx =
          canvas.getContext(
            "2d"
          );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            function(blob){

              if(blob){

                resolve(blob);

              }
              else{

                reject(
                  new Error(
                    "Photo compression failed"
                  )
                );

              }

            },
            "image/jpeg",
            0.75
          );

        };


        img.onerror =
        function(){

          reject(
            new Error(
              "Image load failed"
            )
          );

        };


        img.src =
        reader.result;

      };


      reader.onerror =
      function(){

        reject(
          new Error(
            "File read failed"
          )
        );

      };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

  try{

    const snap =
    await getDoc(
      doc(
        db,
        "users",
        userId
      )
    );


    if(
      snap.exists()
    ){

      const data =
      snap.data();


      profileName.textContent =
      data.full_name ||
      "Carpenter";


      profileUsername.textContent =
      "@" +
      (
        data.username ||
        "carpenter"
      );


      profileBio.textContent =
      data.bio ||
      "Carpenter Community Member";


      profileLocation.textContent =
      data.location
      ?
      "📍 " +
      data.location
      :
      "📍 Location not added";


      if(
        data.photo_url
      ){

        profilePhoto.src =
        data.photo_url;

      }
      else{

        profilePhoto.src =
        defaultPhoto;

      }


      /* EDIT VALUES */

      nameInput.value =
      data.full_name ||
      "";


      usernameInput.value =
      data.username ||
      "";


      bioInput.value =
      data.bio ||
      "";


      locationInput.value =
      data.location ||
      "";

    }

    else{

      profilePhoto.src =
      defaultPhoto;


      nameInput.value =
      "Carpenter";


      usernameInput.value =
      "carpenter";


      bioInput.value =
      "Carpenter Community Member";


      locationInput.value =
      "";

    }


    await loadStats();


    await loadUserPosts();

  }
  catch(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );


    showMessage(
      "Profile load नहीं हुई"
    );

  }

}


/* =========================
   STATS
========================= */

async function loadStats(){

  try{

    const followersSnapshot =
    await getDocs(
      collection(
        db,
        "users",
        userId,
        "followers"
      )
    );


    const followingSnapshot =
    await getDocs(
      collection(
        db,
        "users",
        userId,
        "following"
      )
    );


    followersCount.textContent =
    followersSnapshot.size;


    followingCount.textContent =
    followingSnapshot.size;

  }
  catch(error){

    console.error(
      "STATS ERROR:",
      error
    );

  }

}


/* =========================
   USER POSTS
========================= */

async function loadUserPosts(){

  try{

    const postsRef =
    collection(
      db,
      "community_posts"
    );


    const q =
    query(
      postsRef,
      where(
        "user_id",
        "==",
        userId
      )
    );


    const snapshot =
    await getDocs(q);


    postsCount.textContent =
    snapshot.size;


    if(
      snapshot.empty
    ){

      userPosts.innerHTML = `

        <div class="empty">

          📸

          <p style="margin-top:8px;">
            अभी कोई Post नहीं है।
          </p>

        </div>

      `;

      return;

    }


    userPosts.innerHTML =
    "";


    snapshot.forEach(
      function(postDoc){

        const post =
        postDoc.data();


        const card =
        document.createElement(
          "div"
        );


        card.className =
        "post-card";


        if(
          post.post_text
        ){

          const text =
          document.createElement(
            "div"
          );


          text.className =
          "post-text";


          text.textContent =
          post.post_text;


          card.appendChild(
            text
          );

        }


        if(
          post.image_url
        ){

          const image =
          document.createElement(
            "img"
          );


          image.className =
          "post-image";


          image.src =
          post.image_url;


          image.alt =
          "Carpenter Post";


          image.loading =
          "lazy";


          card.appendChild(
            image
          );

        }


        userPosts.appendChild(
          card
        );

      }
    );

  }
  catch(error){

    console.error(
      "POSTS ERROR:",
      error
    );


    userPosts.innerHTML = `

      <div class="empty">

        ⚠️

        <p style="margin-top:8px;">
          Posts load नहीं हो सके।
        </p>

      </div>

    `;

  }

}


/* =========================
   FOLLOW
========================= */

followBtn.addEventListener(
  "click",
  async function(){

    showMessage(
      "Follow system अगले Step में जोड़ेंगे"
    );

  }
);


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  message.textContent =
  text;


  message.style.display =
  "block";


  setTimeout(
    function(){

      message.style.display =
      "none";

    },
    3000
  );

}


/* =========================
   START
========================= */

loadProfile();

</script>
