<!-- =====================================================

<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  collection,
  getDocs,
  query,
  where,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyCKTMSuuxEVj0ZTT9CAJW5NgJ9ynH6Qsto",

  authDomain:
  "anil-carpenter-community.firebaseapp.com",

  projectId:
  "anil-carpenter-community",

  storageBucket:
  "anil-carpenter-community.firebasestorage.app",

  messagingSenderId:
  "835868472367",

  appId:
  "1:835868472367:web:a320614a701cd3bbf102da",

  measurementId:
  "G-BDDMVGQP4T"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
initializeApp(
  firebaseConfig
);


const db =
getFirestore(
  app
);


const storage =
getStorage(
  app
);


/* =====================================================
   CURRENT USER ID
===================================================== */

let userId =
localStorage.getItem(
  "carpenterUserId"
);


if(!userId){

  if(
    typeof crypto !== "undefined" &&
    crypto.randomUUID
  ){

    userId =
    crypto.randomUUID();

  }
  else{

    userId =
    "user_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,10);

  }


  localStorage.setItem(
    "carpenterUserId",
    userId
  );

}


/* =====================================================
   PROFILE USER ID
   दूसरे व्यक्ति की profile खोलने के लिए
===================================================== */

const urlParams =
new URLSearchParams(
  window.location.search
);


const profileUserId =
urlParams.get("userId") ||
userId;


/* =====================================================
   ELEMENTS
===================================================== */

const profilePhoto =
document.getElementById(
  "profilePhoto"
);


const profileName =
document.getElementById(
  "profileName"
);


const profileUsername =
document.getElementById(
  "profileUsername"
);


const profileBio =
document.getElementById(
  "profileBio"
);


const profileLocation =
document.getElementById(
  "profileLocation"
);


const followersCount =
document.getElementById(
  "followersCount"
);


const followingCount =
document.getElementById(
  "followingCount"
);


const postsCount =
document.getElementById(
  "postsCount"
);


const followBtn =
document.getElementById(
  "followBtn"
);


const editBtn =
document.getElementById(
  "editBtn"
);


const editBox =
document.getElementById(
  "editBox"
);


const photoInput =
document.getElementById(
  "photoInput"
);


const nameInput =
document.getElementById(
  "nameInput"
);


const usernameInput =
document.getElementById(
  "usernameInput"
);


const bioInput =
document.getElementById(
  "bioInput"
);


const locationInput =
document.getElementById(
  "locationInput"
);


const saveBtn =
document.getElementById(
  "saveBtn"
);


const userPosts =
document.getElementById(
  "userPosts"
);


const message =
document.getElementById(
  "message"
);


/* =====================================================
   DEFAULT PROFILE PHOTO
===================================================== */

const defaultPhoto =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="300"
  height="300"
>

  <rect
    width="300"
    height="300"
    fill="#fde68a"
  />

  <text
    x="150"
    y="175"
    text-anchor="middle"
    font-size="110"
  >
    👷
  </text>

</svg>

`);


/* =====================================================
   INITIAL PHOTO
===================================================== */

profilePhoto.src =
defaultPhoto;


/* =====================================================
   EDIT BUTTON
   केवल अपनी profile पर
===================================================== */

if(
  profileUserId !== userId
){

  editBtn.style.display =
  "none";

  editBox.style.display =
  "none";

}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

photoInput.addEventListener(
  "change",
  function(){

    const file =
    photoInput.files[0];


    if(!file){
      return;
    }


    if(
      !file.type.startsWith("image/")
    ){

      showMessage(
        "❌ कृपया केवल Image चुनें"
      );

      photoInput.value =
      "";

      profilePhoto.src =
      defaultPhoto;

      return;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(event){

      profilePhoto.src =
      event.target.result;

    };


    reader.onerror =
    function(){

      showMessage(
        "❌ Image preview नहीं बन सकी"
      );

    };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   EDIT PROFILE OPEN / CLOSE
===================================================== */

editBtn.addEventListener(
  "click",
  function(){

    if(
      profileUserId !== userId
    ){

      return;

    }


    if(
      editBox.style.display ===
      "block"
    ){

      editBox.style.display =
      "none";

    }
    else{

      editBox.style.display =
      "block";

    }

  }
);


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(text){

  message.textContent =
  text;


  message.style.display =
  "block";


  clearTimeout(
    window.profileMessageTimer
  );


  window.profileMessageTimer =
  setTimeout(
    function(){

      message.style.display =
      "none";

    },
    3000
  );

}


/* =====================================================
   PART 2 END
===================================================== */
<!-- =====================================================
     PART 3 — SAVE PROFILE + PHOTO UPLOAD
===================================================== */


/* =====================================================
   SAVE BUTTON
===================================================== */

saveBtn.addEventListener(
  "click",
  saveProfile
);


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

  /* केवल अपनी profile edit कर सकते हैं */

  if(
    profileUserId !== userId
  ){

    showMessage(
      "❌ यह आपकी Profile नहीं है"
    );

    return;

  }


  /* ===================================================
     GET FORM VALUES
  =================================================== */

  const name =
    nameInput.value.trim();


  let username =
    usernameInput.value
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9_]/g,
        ""
      );


  const bio =
    bioInput.value.trim();


  const location =
    locationInput.value.trim();


  /* ===================================================
     VALIDATION
  =================================================== */

  if(!name){

    showMessage(
      "❌ नाम लिखें"
    );

    return;

  }


  if(!username){

    showMessage(
      "❌ Username लिखें"
    );

    return;

  }


  /* ===================================================
     DISABLE SAVE BUTTON
  =================================================== */

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "⏳ Saving...";


  try{

    /* =================================================
       LOAD EXISTING PROFILE
    ================================================= */

    const profileRef =
      doc(
        db,
        "users",
        userId
      );


    const oldProfile =
      await getDoc(
        profileRef
      );


    let photoUrl =
      null;


    /* =================================================
       KEEP OLD PHOTO
    ================================================= */

    if(
      oldProfile.exists()
    ){

      const oldData =
        oldProfile.data();


      photoUrl =
        oldData.photo_url ||
        null;

    }


    /* =================================================
       NEW PHOTO SELECTED
    ================================================= */

    if(
      photoInput.files &&
      photoInput.files.length > 0
    ){

      const file =
        photoInput.files[0];


      /* -----------------------------------------------
         CHECK FILE TYPE
      ----------------------------------------------- */

      if(
        !file.type.startsWith("image/")
      ){

        throw new Error(
          "कृपया केवल Image चुनें"
        );

      }


      /* -----------------------------------------------
         CHECK FILE SIZE
         Original file 10MB से ज्यादा नहीं
      ----------------------------------------------- */

      if(
        file.size >
        10 * 1024 * 1024
      ){

        throw new Error(
          "Photo 10MB से छोटी रखें"
        );

      }


      /* -----------------------------------------------
         COMPRESS IMAGE
      ----------------------------------------------- */

      const compressedImage =
        await compressImage(
          file
        );


      /* -----------------------------------------------
         STORAGE FILE PATH
      ----------------------------------------------- */

      const fileRef =
        ref(
          storage,
          "profile-photos/" +
          userId +
          "/" +
          Date.now() +
          ".jpg"
        );


      /* -----------------------------------------------
         UPLOAD TO FIREBASE STORAGE
      ----------------------------------------------- */

      await uploadBytes(
        fileRef,
        compressedImage,
        {
          contentType:
            "image/jpeg"
        }
      );


      /* -----------------------------------------------
         GET DOWNLOAD URL
      ----------------------------------------------- */

      photoUrl =
        await getDownloadURL(
          fileRef
        );

    }


    /* =================================================
       SAVE PROFILE TO FIRESTORE
    ================================================= */

    await setDoc(
      profileRef,
      {

        user_id:
          userId,

        full_name:
          name,

        username:
          username,

        bio:
          bio,

        location:
          location,

        photo_url:
          photoUrl,

        updated_at:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    /* =================================================
       CLEAR PHOTO INPUT
    ================================================= */

    photoInput.value =
      "";


    /* =================================================
       SUCCESS
    ================================================= */

    showMessage(
      "✅ Profile Save हो गई"
    );


    /* =================================================
       CLOSE EDIT BOX
    ================================================= */

    editBox.style.display =
      "none";


    /* =================================================
       RELOAD PROFILE
    ================================================= */

    await loadProfile();

  }
  catch(error){

    console.error(
      "PROFILE SAVE ERROR:",
      error
    );


    /* =================================================
       FRIENDLY ERROR MESSAGE
    ================================================= */

    let errorMessage =
      error.message ||
      "Unknown error";


    if(
      errorMessage
        .toLowerCase()
        .includes("permission")
    ){

      errorMessage =
        "Firebase Permission denied";

    }


    if(
      errorMessage
        .toLowerCase()
        .includes("billing")
    ){

      errorMessage =
        "Firebase Storage में Billing/Upgrade की समस्या है";

    }


    if(
      errorMessage
        .toLowerCase()
        .includes("quota")
    ){

      errorMessage =
        "Firebase quota समाप्त हो गया है";

    }


    showMessage(
      "❌ " +
      errorMessage
    );

  }
  finally{

    saveBtn.disabled =
      false;


    saveBtn.textContent =
      "💾 Profile Save करें";

  }

}


/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      /* =================================================
         FILE READ
      ================================================= */

      reader.onload =
        function(){

          const img =
            new Image();


          /* =================================================
             IMAGE LOAD
          ================================================= */

          img.onload =
            function(){

              const maxSize =
                800;


              let width =
                img.width;


              let height =
                img.height;


              /* =================================================
                 RESIZE LANDSCAPE
              ================================================= */

              if(
                width >
                height
              ){

                if(
                  width >
                  maxSize
                ){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );


                  width =
                    maxSize;

                }

              }


              /* =================================================
                 RESIZE PORTRAIT
              ================================================= */

              else{

                if(
                  height >
                  maxSize
                ){

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );


                  height =
                    maxSize;

                }

              }


              /* =================================================
                 CANVAS
              ================================================= */

              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              if(!ctx){

                reject(
                  new Error(
                    "Canvas support नहीं है"
                  )
                );

                return;

              }


              /* =================================================
                 DRAW IMAGE
              ================================================= */

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              /* =================================================
                 CONVERT TO JPEG
              ================================================= */

              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(
                      blob
                    );

                  }
                  else{

                    reject(
                      new Error(
                        "Photo compression failed"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.75
              );

            };


          /* =================================================
             IMAGE ERROR
          ================================================= */

          img.onerror =
            function(){

              reject(
                new Error(
                  "Image load failed"
                )
              );

            };


          img.src =
            reader.result;

        };


      /* =================================================
         FILE ERROR
      ================================================= */

      reader.onerror =
        function(){

          reject(
            new Error(
              "Photo file read नहीं हो सकी"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  try{

    const profileRef =
      doc(
        db,
        "users",
        profileUserId
      );


    const snap =
      await getDoc(
        profileRef
      );


    /* =================================================
       PROFILE EXISTS
    ================================================= */

    if(
      snap.exists()
    ){

      const data =
        snap.data();


      /* -----------------------------------------------
         NAME
      ----------------------------------------------- */

      profileName.textContent =
        data.full_name ||
        "Carpenter";


      /* -----------------------------------------------
         USERNAME
      ----------------------------------------------- */

      profileUsername.textContent =
        "@" +
        (
          data.username ||
          "carpenter"
        );


      /* -----------------------------------------------
         BIO
      ----------------------------------------------- */

      profileBio.textContent =
        data.bio ||
        "Carpenter Community Member";


      /* -----------------------------------------------
         LOCATION
      ----------------------------------------------- */

      profileLocation.textContent =
        data.location
        ?
        "📍 " + data.location
        :
        "📍 Location not added";


      /* -----------------------------------------------
         PROFILE PHOTO
      ----------------------------------------------- */

      if(
        data.photo_url
      ){

        profilePhoto.src =
          data.photo_url;

      }
      else{

        profilePhoto.src =
          defaultPhoto;

      }


      /* =================================================
         EDIT FORM
         केवल अपनी profile पर भरें
      ================================================= */

      if(
        profileUserId === userId
      ){

        nameInput.value =
          data.full_name ||
          "";


        usernameInput.value =
          data.username ||
          "";


        bioInput.value =
          data.bio ||
          "";


        locationInput.value =
          data.location ||
          "";

      }

    }


    /* =================================================
       PROFILE DOES NOT EXIST
    ================================================= */

    else{

      if(
        profileUserId === userId
      ){

        profilePhoto.src =
          defaultPhoto;


        nameInput.value =
          "Carpenter";


        usernameInput.value =
          "carpenter";


        bioInput.value =
          "Carpenter Community Member";


        locationInput.value =
          "";

      }
      else{

        profileName.textContent =
          "Carpenter";


        profileUsername.textContent =
          "@carpenter";


        profileBio.textContent =
          "Carpenter Community Member";


        profileLocation.textContent =
          "📍 Location not added";


        profilePhoto.src =
          defaultPhoto;

      }

    }


    /* =================================================
       LOAD COUNTS
    ================================================= */

    await loadStats();


    /* =================================================
       LOAD USER POSTS
    ================================================= */

    await loadUserPosts();

  }
  catch(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );


    showMessage(
      "❌ Profile load नहीं हुई"
    );

  }

}


/* =====================================================
   LOAD FOLLOWERS + FOLLOWING COUNTS
===================================================== */

async function loadStats(){

  try{

    /* =================================================
       FOLLOWERS
       Target profile के followers
    ================================================= */

    const followersRef =
      collection(
        db,
        "users",
        profileUserId,
        "followers"
      );


    const followersSnapshot =
      await getDocs(
        followersRef
      );


    followersCount.textContent =
      followersSnapshot.size;


    /* =================================================
       FOLLOWING
       Target profile किन लोगों को follow करती है
    ================================================= */

    const followingRef =
      collection(
        db,
        "users",
        profileUserId,
        "following"
      );


    const followingSnapshot =
      await getDocs(
        followingRef
      );


    followingCount.textContent =
      followingSnapshot.size;

  }
  catch(error){

    console.error(
      "STATS ERROR:",
      error
    );


    followersCount.textContent =
      "0";


    followingCount.textContent =
      "0";

  }

}


/* =====================================================
   LOAD USER POSTS
===================================================== */

async function loadUserPosts(){

  try{

    /* =================================================
       COMMUNITY POSTS COLLECTION
    ================================================= */

    const postsRef =
      collection(
        db,
        "community_posts"
      );


    /* =================================================
       केवल इस profile के posts
    ================================================= */

    const postsQuery =
      query(
        postsRef,
        where(
          "user_id",
          "==",
          profileUserId
        )
      );


    const snapshot =
      await getDocs(
        postsQuery
      );


    /* =================================================
       POSTS COUNT
    ================================================= */

    postsCount.textContent =
      snapshot.size;


    /* =================================================
       NO POSTS
    ================================================= */

    if(
      snapshot.empty
    ){

      userPosts.innerHTML = `

        <div class="empty">

          📸

          <p style="margin-top:8px;">
            अभी कोई Post नहीं है।
          </p>

        </div>

      `;

      return;

    }


    /* =================================================
       CLEAR OLD POSTS
    ================================================= */

    userPosts.innerHTML =
      "";


    /* =================================================
       DISPLAY POSTS
    ================================================= */

    snapshot.forEach(
      function(postDoc){

        const post =
          postDoc.data();


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "post-card";


        /* -----------------------------------------------
           POST TEXT
        ----------------------------------------------- */

        if(
          post.post_text
        ){

          const text =
            document.createElement(
              "div"
            );


          text.className =
            "post-text";


          text.textContent =
            post.post_text;


          card.appendChild(
            text
          );

        }


        /* -----------------------------------------------
           POST IMAGE
        ----------------------------------------------- */

        if(
          post.image_url
        ){

          const image =
            document.createElement(
              "img"
            );


          image.className =
            "post-image";


          image.src =
            post.image_url;


          image.alt =
            "Carpenter Post";


          image.loading =
            "lazy";


          card.appendChild(
            image
          );

        }


        /* -----------------------------------------------
           ADD CARD
        ----------------------------------------------- */

        userPosts.appendChild(
          card
        );

      }
    );

  }
  catch(error){

    console.error(
      "POSTS ERROR:",
      error
    );


    postsCount.textContent =
      "0";


    userPosts.innerHTML = `

      <div class="empty">

        ⚠️

        <p style="margin-top:8px;">
          Posts load नहीं हो सके।
        </p>

      </div>

    `;

  }

}

/* =====================================================
   CHECK FOLLOW STATUS
===================================================== */

async function checkFollowStatus(){

  try{

    /* अपनी Profile */

    if(
      profileUserId === userId
    ){

      followBtn.textContent =
        "👤 Your Profile";

      followBtn.disabled =
        true;

      followBtn.style.opacity =
        "0.6";

      return;

    }


    /* =================================================
       TARGET USER के FOLLOWERS में
       CURRENT USER मौजूद है या नहीं
    ================================================= */

    const followerRef =
      doc(
        db,
        "users",
        profileUserId,
        "followers",
        userId
      );


    const followerSnap =
      await getDoc(
        followerRef
      );


    if(
      followerSnap.exists()
    ){

      followBtn.textContent =
        "✓ Following";

      followBtn.classList.add(
        "following"
      );

    }
    else{

      followBtn.textContent =
        "➕ Follow";

      followBtn.classList.remove(
        "following"
      );

    }

  }
  catch(error){

    console.error(
      "FOLLOW STATUS ERROR:",
      error
    );

  }

}


/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

followBtn.addEventListener(
  "click",
  async function(){

    /* अपनी Profile */

    if(
      profileUserId === userId
    ){

      showMessage(
        "यह आपकी अपनी Profile है"
      );

      return;

    }


    followBtn.disabled =
      true;

    followBtn.textContent =
      "⏳ Please wait...";


    try{

      /* =================================================
         FOLLOWER DOCUMENT
      ================================================= */

      const followerRef =
        doc(
          db,
          "users",
          profileUserId,
          "followers",
          userId
        );


      /* =================================================
         FOLLOWING DOCUMENT
      ================================================= */

      const followingRef =
        doc(
          db,
          "users",
          userId,
          "following",
          profileUserId
        );


      /* =================================================
         CHECK EXISTING FOLLOW
      ================================================= */

      const existingFollow =
        await getDoc(
          followerRef
        );


      /* =================================================
         UNFOLLOW
      ================================================= */

      if(
        existingFollow.exists()
      ){

        await deleteDoc(
          followerRef
        );


        await deleteDoc(
          followingRef
        );


        showMessage(
          "✓ Unfollow कर दिया"
        );

      }


      /* =================================================
         FOLLOW
      ================================================= */

      else{

        await setDoc(
          followerRef,
          {

            user_id:
              userId,

            followed_user_id:
              profileUserId,

            created_at:
              serverTimestamp()

          }
        );


        await setDoc(
          followingRef,
          {

            user_id:
              userId,

            following_user_id:
              profileUserId,

            created_at:
              serverTimestamp()

          }
        );


        showMessage(
          "❤️ Following"
        );

      }


      /* =================================================
         REFRESH COUNTS
      ================================================= */

      await loadStats();


      /* =================================================
         REFRESH BUTTON
      ================================================= */

      await checkFollowStatus();

    }
    catch(error){

      console.error(
        "FOLLOW ERROR:",
        error
      );


      showMessage(
        "❌ Follow नहीं हो पाया: " +
        (
          error.message ||
          "Unknown error"
        )
      );


      await checkFollowStatus();

    }
    finally{

      if(
        profileUserId !== userId
      ){

        followBtn.disabled =
          false;

      }

    }

  }
);
