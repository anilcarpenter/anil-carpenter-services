<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Anil Carpenter Community | Profile</title>

<meta name="description"
content="Anil Carpenter Community Profile - Carpenter अपना profile, post, reel, thread और story share करें।">

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f4f5f7;
  color:#111827;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
HEADER
========================= */

.header{
  height:60px;
  background:#111827;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  position:sticky;
  top:0;
  z-index:2000;
}

.logo{
  font-size:18px;
  font-weight:800;
}

.logo span{
  color:#f59e0b;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.header-btn{
  border:1px solid #4b5563;
  background:transparent;
  color:#fff;

  border-radius:10px;
  padding:8px 11px;

  font-size:14px;
  font-weight:bold;
}

.menu-btn{
  border:0;
  background:transparent;
  color:#fff;

  font-size:25px;
  padding:5px 8px;
}

/* =========================
PROFILE
========================= */

.profile{
  background:#fff;
  text-align:center;

  padding:28px 15px 22px;

  border-bottom:1px solid #e5e7eb;
}

.photo-area{
  width:115px;
  height:115px;
  margin:auto;
  position:relative;
}

.profile-photo{
  width:115px;
  height:115px;

  object-fit:cover;

  border-radius:50%;
  border:4px solid #f59e0b;

  background:#fde68a;
}

.photo-edit{
  position:absolute;
  right:0;
  bottom:0;

  width:36px;
  height:36px;

  border-radius:50%;
  border:3px solid #fff;

  background:#111827;
  color:#fff;

  font-size:16px;
}

.name{
  margin-top:13px;

  font-size:25px;
  font-weight:800;
}

.username{
  margin-top:5px;

  color:#6b7280;
  font-size:15px;
}

.bio{
  max-width:500px;

  margin:13px auto 5px;

  color:#374151;

  line-height:1.55;

  white-space:pre-wrap;
}

.location{
  margin-top:8px;

  color:#6b7280;

  font-size:14px;
}

.stats{
  display:flex;
  justify-content:center;

  gap:45px;

  margin:23px 0;
}

.stat{
  min-width:65px;
  cursor:pointer;
}

.stat-number{
  display:block;

  font-size:21px;
  font-weight:800;
}

.stat-label{
  display:block;

  margin-top:4px;

  color:#6b7280;
  font-size:13px;
}

.profile-buttons{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:8px;

  flex-wrap:wrap;
}

.profile-btn{
  border:0;

  border-radius:10px;

  padding:11px 18px;

  font-size:14px;
  font-weight:800;
}

.follow-btn{
  background:#f59e0b;
  color:#111827;
}

.following-btn{
  background:#111827;
  color:#fff;
}

.message-btn{
  background:#e5e7eb;
  color:#111827;
}

.edit-btn{
  background:#111827;
  color:#fff;
}

/* =========================
TABS
========================= */

.tabs{
  display:flex;

  position:sticky;
  top:60px;

  z-index:1000;

  background:#fff;

  border-bottom:1px solid #ddd;
}

.tab{
  flex:1;

  border:0;

  background:#fff;

  padding:14px 5px;

  color:#6b7280;

  font-size:14px;
  font-weight:800;
}

.tab.active{
  color:#111827;

  border-bottom:3px solid #f59e0b;
}

/* =========================
MAIN CONTENT
========================= */

.content{
  width:100%;
  max-width:700px;

  margin:auto;

  padding:15px;
}

/* =========================
CREATE BOX
========================= */

.create-box{
  background:#fff;

  border-radius:16px;

  padding:15px;

  margin-bottom:15px;

  box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.create-title{
  font-size:17px;
  font-weight:800;

  margin-bottom:12px;
}

.create-types{
  display:flex;

  gap:7px;

  overflow-x:auto;

  padding-bottom:4px;

  margin-bottom:11px;
}

.create-type{
  flex:0 0 auto;

  border:1px solid #ddd;

  background:#fff;

  border-radius:22px;

  padding:8px 13px;

  font-size:13px;
  font-weight:bold;
}

.create-type.active{
  background:#111827;
  color:#fff;

  border-color:#111827;
}

textarea,
input[type="text"],
input[type="url"]{
  width:100%;

  border:1px solid #d1d5db;

  border-radius:10px;

  padding:11px 12px;

  outline:none;

  background:#fff;

  color:#111827;

  font-size:14px;
}

textarea{
  min-height:100px;

  resize:vertical;
}

textarea:focus,
input:focus{
  border-color:#f59e0b;
}

.media-input{
  margin-top:9px;
}

.publish-btn{
  width:100%;

  border:0;

  border-radius:10px;

  padding:12px;

  margin-top:9px;

  background:#f59e0b;

  color:#111827;

  font-size:14px;
  font-weight:800;
}

/* =========================
POST CARD
========================= */

.post-card{
  background:#fff;

  border-radius:16px;

  padding:15px;

  margin-bottom:12px;

  box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.post-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.post-user{
  display:flex;
  align-items:center;

  gap:9px;
}

.post-avatar{
  width:40px;
  height:40px;

  border-radius:50%;

  object-fit:cover;

  background:#fde68a;
}

.post-user-name{
  font-weight:800;
}

.post-time{
  color:#9ca3af;
  font-size:11px;
}

.post-type{
  display:inline-block;

  margin-top:10px;

  padding:5px 9px;

  border-radius:20px;

  background:#f3f4f6;

  color:#374151;

  font-size:11px;
  font-weight:bold;
}

.post-text{
  margin-top:11px;

  line-height:1.55;

  white-space:pre-wrap;

  word-break:break-word;
}

.post-media{
  width:100%;

  max-height:520px;

  object-fit:cover;

  border-radius:12px;

  margin-top:11px;
}

.post-video{
  width:100%;

  max-height:520px;

  border-radius:12px;

  margin-top:11px;

  background:#000;
}

/* =========================
EMPTY
========================= */

.empty{
  background:#fff;

  border-radius:16px;

  padding:35px 20px;

  text-align:center;

  color:#6b7280;
}

.empty h3{
  color:#111827;
}

/* =========================
MODAL
========================= */

.modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:8000;

  background:rgba(0,0,0,.55);

  padding:15px;

  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  max-width:520px;

  max-height:90vh;

  overflow-y:auto;

  background:#fff;

  border-radius:18px;

  padding:18px;
}

.modal-header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:15px;
}

.modal-header h3{
  margin:0;
}

.close-btn{
  width:35px;
  height:35px;

  border:0;

  border-radius:50%;

  background:#f3f4f6;

  font-size:18px;
}

.form-group{
  margin-bottom:11px;
}

.form-group label{
  display:block;

  margin-bottom:6px;

  font-size:13px;
  font-weight:bold;
}

.save-btn{
  width:100%;

  border:0;

  border-radius:10px;

  padding:12px;

  background:#111827;

  color:#fff;

  font-weight:800;
}

/* =========================
CHAT
========================= */

.chat-box{
  display:flex;
  flex-direction:column;

  gap:9px;
}

.chat-messages{
  height:360px;

  overflow-y:auto;

  background:#f3f4f6;

  border-radius:12px;

  padding:10px;
}

.chat-message{
  max-width:80%;

  padding:9px 12px;

  margin:5px 0;

  border-radius:14px;

  line-height:1.4;

  font-size:14px;

  word-break:break-word;
}

.chat-message.me{
  margin-left:auto;

  background:#111827;

  color:#fff;
}

.chat-message.other{
  background:#fff;

  color:#111827;
}

.chat-input-row{
  display:flex;

  gap:7px;
}

.chat-input-row input{
  flex:1;
}

.chat-send{
  border:0;

  border-radius:10px;

  padding:0 16px;

  background:#f59e0b;

  color:#111827;

  font-weight:800;
}

/* =========================
USER LIST
========================= */

.user-list{
  display:flex;
  flex-direction:column;

  gap:8px;
}

.user-item{
  display:flex;

  align-items:center;

  gap:10px;

  padding:10px;

  border-radius:12px;

  background:#f9fafb;

  cursor:pointer;
}

.user-item:hover{
  background:#f3f4f6;
}

.user-item img{
  width:45px;
  height:45px;

  border-radius:50%;

  object-fit:cover;
}

.user-item-name{
  font-weight:800;
}

.user-item-username{
  color:#6b7280;

  font-size:12px;

  margin-top:2px;
}

/* =========================
SIDE MENU
========================= */

.side-menu{
  position:fixed;

  top:0;
  right:-330px;

  width:310px;
  max-width:88%;

  height:100vh;

  background:#fff;

  z-index:9000;

  overflow-y:auto;

  box-shadow:-5px 0 20px rgba(0,0,0,.2);

  transition:right .25s ease;
}

.side-menu.active{
  right:0;
}

.menu-header{
  position:sticky;

  top:0;

  z-index:2;

  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:17px;

  background:#111827;

  color:#fff;

  font-size:18px;
}

.menu-header button{
  border:0;

  background:transparent;

  color:#fff;

  font-size:20px;
}

.menu-section{
  padding:10px;

  border-bottom:1px solid #eee;
}

.menu-title{
  padding:8px;

  color:#6b7280;

  font-size:12px;
  font-weight:800;
}

.menu-section button{
  display:block;

  width:100%;

  border:0;

  border-radius:9px;

  background:#fff;

  color:#111827;

  text-align:left;

  padding:12px;

  font-size:14px;
}

.menu-section button:hover{
  background:#f3f4f6;
}

/* =========================
TOAST
========================= */

.toast{
  display:none;

  position:fixed;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  z-index:10000;

  background:#111827;

  color:#fff;

  padding:11px 16px;

  border-radius:10px;

  font-size:13px;

  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:500px){

  .logo{
    font-size:16px;
  }

  .header-btn{
    padding:7px 9px;
  }

  .stats{
    gap:25px;
  }

  .profile-btn{
    flex:1;
    min-width:105px;
  }

  .content{
    padding:10px;
  }

}

</style>
</head>

<body>

<!-- =====================================================
HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    🪚 <span>Anil</span> Carpenter
  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      type="button"
      onclick="goHome()">
      🏠
    </button>

    <button
      class="menu-btn"
      type="button"
      onclick="openMenu()">
      ☰
    </button>

  </div>

</header>


<!-- =====================================================
PROFILE
===================================================== -->

<section class="profile">

  <div class="photo-area">

    <img
      id="profilePhoto"
      class="profile-photo"
      alt="Profile Photo">

    <button
      id="photoEditButton"
      class="photo-edit"
      type="button"
      onclick="chooseProfilePhoto()">
      📷
    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      hidden>

  </div>


  <div
    id="profileName"
    class="name">
    Loading...
  </div>


  <div
    id="profileUsername"
    class="username">
    @carpenter
  </div>


  <div
    id="profileBio"
    class="bio">
    Carpenter Community
  </div>


  <div
    id="profileLocation"
    class="location">
    📍 India
  </div>


  <div class="stats">

    <div
      class="stat"
      onclick="openFollowers()">

      <span
        id="followersCount"
        class="stat-number">
        0
      </span>

      <span class="stat-label">
        Followers
      </span>

    </div>


    <div
      class="stat"
      onclick="openFollowing()">

      <span
        id="followingCount"
        class="stat-number">
        0
      </span>

      <span class="stat-label">
        Following
      </span>

    </div>


    <div
      class="stat"
      onclick="showTab('post')">

      <span
        id="postsCount"
        class="stat-number">
        0
      </span>

      <span class="stat-label">
        Posts
      </span>

    </div>

  </div>


  <div class="profile-buttons">

    <button
      id="followBtn"
      class="profile-btn follow-btn"
      type="button"
      onclick="toggleFollow()">
      ➕ Follow
    </button>


    <button
      id="messageBtn"
      class="profile-btn message-btn"
      type="button"
      onclick="openMessage()">
      💬 Message
    </button>


    <button
      id="editBtn"
      class="profile-btn edit-btn"
      type="button"
      onclick="openEditProfile()">
      ✏️ Edit Profile
    </button>

  </div>

</section>


<!-- =====================================================
TABS
===================================================== -->

<nav class="tabs">

  <button
    id="tabPost"
    class="tab active"
    type="button"
    onclick="showTab('post',this)">
    📷 Posts
  </button>


  <button
    id="tabReel"
    class="tab"
    type="button"
    onclick="showTab('reel',this)">
    🎬 Reels
  </button>


  <button
    id="tabThread"
    class="tab"
    type="button"
    onclick="showTab('thread',this)">
    ✍️ Threads
  </button>


  <button
    id="tabStory"
    class="tab"
    type="button"
    onclick="showTab('story',this)">
    ⭕ Story
  </button>

</nav>


<!-- =====================================================
CONTENT
===================================================== -->

<main class="content">


  <!-- CREATE -->

  <section
    id="createBox"
    class="create-box">

    <div class="create-title">
      ✨ अपना काम शेयर करें
    </div>


    <div class="create-types">

      <button
        class="create-type active"
        type="button"
        onclick="selectCreateType('post',this)">
        📷 Post
      </button>


      <button
        class="create-type"
        type="button"
        onclick="selectCreateType('reel',this)">
        🎬 Reel
      </button>


      <button
        class="create-type"
        type="button"
        onclick="selectCreateType('thread',this)">
        ✍️ Thread
      </button>


      <button
        class="create-type"
        type="button"
        onclick="selectCreateType('story',this)">
        ⭕ Story
      </button>

    </div>


    <textarea
      id="createText"
      maxlength="5000"
      placeholder="अपना काम, अनुभव या विचार लिखें..."></textarea>


    <div
      id="mediaUrlBox"
      class="media-input"
      style="display:none;">

      <input
        id="mediaUrl"
        type="url"
        placeholder="Reel / Video URL डालें">

    </div>


    <button
      id="publishButton"
      class="publish-btn"
      type="button"
      onclick="publishContent()">
      🚀 Publish
    </button>

  </section>


  <!-- POSTS -->

  <section id="contentArea">

    <div class="empty">
      ⏳ Content loading...
    </div>

  </section>

</main>


<!-- =====================================================
EDIT PROFILE MODAL
===================================================== -->

<div
  id="editModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3>
        ✏️ Edit Profile
      </h3>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('editModal')">
        ✕
      </button>

    </div>


    <div class="form-group">

      <label>
        नाम
      </label>

      <input
        id="editName"
        type="text"
        maxlength="60"
        placeholder="आपका नाम">

    </div>


    <div class="form-group">

      <label>
        Username
      </label>

      <input
        id="editUsername"
        type="text"
        maxlength="30"
        placeholder="username">

    </div>


    <div class="form-group">

      <label>
        Bio
      </label>

      <textarea
        id="editBio"
        maxlength="250"
        placeholder="अपने बारे में लिखें..."></textarea>

    </div>


    <div class="form-group">

      <label>
        Location
      </label>

      <input
        id="editLocation"
        type="text"
        maxlength="100"
        placeholder="जैसे Khalilabad, Sant Kabir Nagar">

    </div>


    <button
      id="saveProfileButton"
      class="save-btn"
      type="button"
      onclick="saveProfile()">
      💾 Save Profile
    </button>

  </div>

</div>


<!-- =====================================================
FOLLOWERS / FOLLOWING MODAL
===================================================== -->

<div
  id="usersModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="usersModalTitle">
        Followers
      </h3>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('usersModal')">
        ✕
      </button>

    </div>


    <div
      id="usersList"
      class="user-list">

      <div class="empty">
        Loading...
      </div>

    </div>

  </div>

</div>


<!-- =====================================================
MESSAGE MODAL
===================================================== -->

<div
  id="messageModal"
  class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="messageTitle">
        💬 Message
      </h3>

      <button
        class="close-btn"
        type="button"
        onclick="closeModal('messageModal')">
        ✕
      </button>

    </div>


    <div class="chat-box">

      <div
        id="chatMessages"
        class="chat-messages">

        <div class="empty">
          अभी कोई message नहीं है।
        </div>

      </div>


      <div class="chat-input-row">

        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="Message लिखें..."
          onkeydown="if(event.key==='Enter')sendMessage()">


        <button
          class="chat-send"
          type="button"
          onclick="sendMessage()">
          ➤
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
SIDE MENU
===================================================== -->

<aside
  id="sideMenu"
  class="side-menu">

  <div class="menu-header">

    <b>
      ☰ Menu
    </b>

    <button
      type="button"
      onclick="closeMenu()">
      ✕
    </button>

  </div>


  <div class="menu-section">

    <div class="menu-title">
      👤 ACCOUNT
    </div>

    <button onclick="goHome()">
      🏠 Home
    </button>

    <button onclick="openEditProfile()">
      ✏️ Edit Profile
    </button>

    <button onclick="chooseProfilePhoto()">
      📷 Change Profile Photo
    </button>

  </div>


  <div class="menu-section">

    <div class="menu-title">
      📱 COMMUNITY
    </div>

    <button onclick="showTab('post')">
      📷 My Posts
    </button>

    <button onclick="showTab('reel')">
      🎬 My Reels
    </button>

    <button onclick="showTab('thread')">
      ✍️ My Threads
    </button>

    <button onclick="showTab('story')">
      ⭕ My Stories
    </button>

  </div>


  <div class="menu-section">

    <div class="menu-title">
      ⚙️ SETTINGS
    </div>

    <button onclick="showComingSoon('Settings')">
      ⚙️ Settings
    </button>

    <button onclick="showComingSoon('Notifications')">
      🔔 Notifications
    </button>

    <button onclick="showComingSoon('Privacy')">
      🔒 Privacy
    </button>

  </div>


  <div class="menu-section">

    <div class="menu-title">
      💰 CARPENTER COMMUNITY
    </div>

    <button onclick="showComingSoon('Carpenter Pro')">
      ⭐ Carpenter Pro
    </button>

    <button onclick="showComingSoon('Promote My Work')">
      📢 Promote My Work
    </button>

    <button onclick="showComingSoon('Business Profile')">
      🏪 Business Profile
    </button>

  </div>


  <div class="menu-section">

    <div class="menu-title">
      ❓ HELP
    </div>

    <button onclick="showComingSoon('Help & Support')">
      ❓ Help & Support
    </button>

    <button onclick="showComingSoon('Community Guidelines')">
      📖 Community Guidelines
    </button>

    <button onclick="showComingSoon('Report a Problem')">
      🚩 Report a Problem
    </button>

  </div>

</aside>


<!-- TOAST -->

<div
  id="toast"

/* =====================================================
IMAGE COMPRESSOR
===================================================== */

function compressImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
      new FileReader();


      reader.onload =
      function(){

        const img =
        new Image();


        img.onload =
        function(){

          let width =
          img.width;

          let height =
          img.height;


          if(
            width >
            height
          ){

            if(
              width >
              maxSize
            ){

              height =
              Math.round(
                height *
                maxSize /
                width
              );

              width =
              maxSize;

            }

          }else{

            if(
              height >
              maxSize
            ){

              width =
              Math.round(
                width *
                maxSize /
                height
              );

              height =
              maxSize;

            }

          }


          const canvas =
          document.createElement(
            "canvas"
          );


          canvas.width =
          width;

          canvas.height =
          height;


          const ctx =
          canvas.getContext(
            "2d"
          );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


        img.onerror =
        reject;


        img.src =
        reader.result;

      };


      reader.onerror =
      reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =====================================================
LOAD CONTENT
===================================================== */

async function loadContent(type){

  const area =
  document.getElementById(
    "contentArea"
  );


  area.innerHTML =
  `<div class="empty">
    ⏳ Loading...
  </div>`;


  try{

    const q =
    query(
      collection(
        db,
        "community_posts"
      ),
      where(
        "user_id",
        "==",
        profileUserId
      )
    );


    const snap =
    await getDocs(q);


    const posts = [];


    snap.forEach(
      item=>{

        const data =
        item.data();


        const itemType =
        normalizeType(
          data.type
        );


        if(
          itemType ===
          type
        ){

          posts.push({

            id:
            item.id,

            ...data

          });

        }

      }
    );


    posts.sort(
      (a,b)=>{

        const A =
        a.created_at?.seconds ||
        0;

        const B =
        b.created_at?.seconds ||
        0;

        return B-A;

      }
    );


    if(
      posts.length ===
      0
    ){

      area.innerHTML = `

        <div class="empty">

          <h3>
            ${typeIcon(type)}
            ${typeName(type)}
          </h3>

          <p>
            अभी यहाँ कोई
            ${typeName(type)}
            नहीं है।
          </p>

        </div>

      `;

      return;

    }


    area.innerHTML =
    posts
    .map(
      renderPost
    )
    .join("");


  }catch(error){

    console.error(error);

    area.innerHTML = `

      <div class="empty">

        ❌ Content load नहीं हुआ।

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
RENDER CONTENT
===================================================== */

function renderPost(post){

  const type =
  normalizeType(
    post.type
  );


  const text =
  post.text ||
  post.post_text ||
  "";


  let media =
  "";


  if(
    post.media_url
  ){

    if(
      type ===
      "reel"
    ){

      media = `

        <video
          class="post-video"
          controls
          playsinline
          src="${escapeAttr(
            post.media_url
          )}">
        </video>

      `;

    }else{

      media = `

        <img
          class="post-media"
          src="${escapeAttr(
            post.media_url
          )}"
          alt="Post"
          loading="lazy">

      `;

    }

  }


  return `

    <article class="post-card">

      <div class="post-head">

        <div class="post-user">

          <img
            class="post-avatar"
            src="${escapeAttr(
              profileData.photo_url ||
              defaultPhoto
            )}"
            alt="User">

          <div>

            <div class="post-user-name">
              ${escapeHTML(
                profileData.full_name ||
                "Carpenter"
              )}
            </div>

            <div class="post-time">
              ${formatDate(
                post.created_at
              )}
            </div>

          </div>

        </div>

      </div>


      <div class="post-type">

        ${typeIcon(type)}
        ${typeName(type)}

      </div>


      ${
        text
        ?
        `<div class="post-text">
          ${escapeHTML(text)}
        </div>`
        :
        ""
      }


      ${media}

    </article>

  `;

}

  try{

    query(
      collection(
        db,
        "community_posts"
      ),
      where(
        "type",
        "==",
        "message"
      ),
      where(
        "chat_id",
        "==",
        currentChatId
      )
    );


    const snap =
    await getDocs(q);


    const messages = [];


    snap.forEach(
      item=>{

        messages.push({

          id:
          item.id,

          ...item.data()

        });

      }
    );


    messages.sort(
      (a,b)=>{

        const A =
        a.created_at?.seconds ||
        0;

        const B =
        b.created_at?.seconds ||
        0;

        return A-B;

      }
    );


    if(
      messages.length ===
      0
    ){

      box.innerHTML =
      `<div class="empty">
        अभी कोई message नहीं है।
      </div>`;

      return;

    }


    box.innerHTML =
    messages
    .map(
      message=>{

        const mine =
        message.sender_id ===
        currentUserId;


        return `

          <div
            class="chat-message
            ${mine ? "me" : "other"}">

            ${escapeHTML(
              message.text ||
              ""
            )}

          </div>

        `;

      }
    )
    .join("");


    box.scrollTop =
    box.scrollHeight;


  }catch(error){

    console.error(error);

    box.innerHTML =
    `<div class="empty">
      ❌ Messages load नहीं हुए।
    </div>`;

  }

}

/* =====================================================
RENDER USER LIST
===================================================== */

async function renderUserList(
  container,
  ids
){

  if(
    ids.length ===
    0
  ){

    container.innerHTML =
    `<div class="empty">
      अभी कोई user नहीं है।
    </div>`;

    return;

  }


  const users = [];


  for(
    const id of ids
  ){

    try{

      const snap =
      await getDoc(
        doc(
          db,
          "users",
          id
        )
      );


      if(
        snap.exists()
      ){

        users.push({

          id:
          id,

          ...snap.data()

        });

      }

    }catch(error){

      console.error(error);

    }

  }


  if(
    users.length ===
    0
  ){

    container.innerHTML =
    `<div class="empty">
      User profile नहीं मिली।
    </div>`;

    return;

  }


  container.innerHTML =
  users
  .map(
    user=>`

      <div
        class="user-item"
        onclick="openUserProfile('${escapeAttr(
          user.id
        )}')">

        <img
          src="${escapeAttr(
            user.photo_url ||
            defaultPhoto
          )}"
          alt="User">

        <div>

          <div class="user-item-name">
            ${escapeHTML(
              user.full_name ||
              "Carpenter"
            )}
          </div>

          <div class="user-item-username">
            @${escapeHTML(
              String(
                user.username ||
                "carpenter"
              ).replace(
                /^@/,
                ""
              )
            )}
          </div>

        </div>

      </div>

    `
  )
  .join("");

}

/* =====================================================
HELPER
===================================================== */

function normalizeType(
  type
){

  if(!type){

    return "post";

  }


  const value =
  String(
    type
  ).toLowerCase();


  if(
    value === "post" ||
    value === "posts"
  ){

    return "post";

  }


  if(
    value === "reel" ||
    value === "reels"
  ){

    return "reel";

  }


  if(
    value === "thread" ||
    value === "threads"
  ){

    return "thread";

  }


  if(
    value === "story" ||
    value === "stories"
  ){

    return "story";

  }


  if(
    value === "message" ||
    value === "messages"
  ){

    return "message";

  }


  return "post";

}


function typeName(
  type
){

  const names = {

    post:
    "Post",

    reel:
    "Reel",

    thread:
    "Thread",

    story:
    "Story"

  };


  return (
    names[type] ||
    "Post"
  );

}


function typeIcon(
  type
){

  const icons = {

    post:
    "📷",

    reel:
    "🎬",

    thread:
    "✍️",

    story:
    "⭕"

  };


  return (
    icons[type] ||
    "📷"
  );

}


function capitalize(
  value
){

  return String(
    value
  ).charAt(0)
  .toUpperCase() +
  String(
    value
  ).slice(1);

}


function formatDate(
  timestamp
){

  if(!timestamp){

    return "अभी";

  }


  try{

    const date =
    timestamp.toDate
    ? timestamp.toDate()
    : new Date(timestamp);


    return date.toLocaleDateString(
      "hi-IN",
      {
        day:
        "numeric",

        month:
        "short",

        year:
        "numeric"
      }
    );

  }catch(error){

    return "अभी";

  }

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(
  value
){

  return escapeHTML(
    value
  );

}


/* =====================================================
TOAST
===================================================== */

let toastTimer;


function showToast(
  message
){

  const toast =
  document.getElementById(
    "toast"
  );


  toast.textContent =
  message;


  toast.style.display =
  "block";


  clearTimeout(
    toastTimer
  );


  toastTimer =
  setTimeout(
    ()=>{

      toast.style.display =
      "none";

    },
    2500
  );

}
