/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  const name =
    nameInput.value.trim();


  let username =
    usernameInput.value
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9_]/g,
        ""
      );


  const bio =
    bioInput.value.trim();


  const location =
    locationInput.value.trim();


  /* =========================
     VALIDATION
  ========================= */

  if(!name){

    showMessage(
      "❌ नाम लिखें"
    );

    return;

  }


  if(!username){

    showMessage(
      "❌ Username लिखें"
    );

    return;

  }


  /* =========================
     SAVING START
  ========================= */

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "⏳ Saving...";


  try{

    const userRef =
      doc(
        db,
        "users",
        userId
      );


    /* =========================
       GET OLD PROFILE
    ========================= */

    const oldProfile =
      await getDoc(
        userRef
      );


    let photoUrl =
      null;


    if(
      oldProfile.exists()
    ){

      photoUrl =
        oldProfile.data().photo_url ||
        null;

    }


    /* =========================
       SAVE BASIC PROFILE FIRST
    ========================= */

    await setDoc(
      userRef,
      {

        user_id:
          userId,

        full_name:
          name,

        username:
          username,

        bio:
          bio,

        location:
          location,

        photo_url:
          photoUrl,

        updated_at:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    /* =========================
       PHOTO UPLOAD
    ========================= */

    if(
      photoInput.files.length > 0
    ){

      try{

        const file =
          photoInput.files[0];


        /* IMAGE CHECK */

        if(
          !file.type.startsWith(
            "image/"
          )
        ){

          throw new Error(
            "केवल Image चुनें"
          );

        }


        /* =========================
           COMPRESS IMAGE
        ========================= */

        const compressedFile =
          await compressImage(
            file
          );


        /* =========================
           STORAGE FILE
        ========================= */

        const fileRef =
          ref(
            storage,
            "profile-photos/" +
            userId +
            "/" +
            Date.now() +
            ".jpg"
          );


        /* =========================
           UPLOAD
        ========================= */

        await uploadBytes(
          fileRef,
          compressedFile,
          {
            contentType:
              "image/jpeg"
          }
        );


        /* =========================
           GET PHOTO URL
        ========================= */

        photoUrl =
          await getDownloadURL(
            fileRef
          );


        /* =========================
           UPDATE PHOTO URL
        ========================= */

        await setDoc(
          userRef,
          {

            photo_url:
              photoUrl,

            updated_at:
              serverTimestamp()

          },
          {
            merge:true
          }
        );


      }
      catch(photoError){

        console.error(
          "PHOTO UPLOAD ERROR:",
          photoError
        );


        /*
         * Photo upload fail होने पर
         * Profile data पहले ही save हो चुका है।
         */

        showMessage(
          "⚠️ Profile Save हुई, Photo upload नहीं हुई"
        );

      }

    }


    /* =========================
       CLEAN PHOTO INPUT
    ========================= */

    photoInput.value = "";


    /* =========================
       CLOSE EDIT BOX
    ========================= */

    editBox.style.display =
      "none";


    /* =========================
       LOAD PROFILE AGAIN
    ========================= */

    await loadProfile();


    /* =========================
       SUCCESS MESSAGE
    ========================= */

    showMessage(
      "✅ Profile Save हो गई"
    );


  }
  catch(error){

    console.error(
      "PROFILE SAVE ERROR:",
      error
    );


    showMessage(
      "❌ Profile Save नहीं हुई"
    );

  }
  finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "💾 Profile Save करें";

  }

}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const img =
            new Image();


          img.onload =
            function(){

              const maxSize =
                800;


              let width =
                img.width;


              let height =
                img.height;


              /* =========================
                 RESIZE
              ========================= */

              if(
                width > height
              ){

                if(
                  width > maxSize
                ){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                }

              }
              else{

                if(
                  height > maxSize
                ){

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              /* =========================
                 CANVAS
              ========================= */

              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              /* =========================
                 JPEG OUTPUT
              ========================= */

              canvas.toBlob(
                function(blob){

                  if(blob){

                    resolve(
                      blob
                    );

                  }
                  else{

                    reject(
                      new Error(
                        "Photo compression failed"
                      )
                    );

                  }

                },
                "image/jpeg",
                0.75
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  "Image load failed"
                )
              );

            };


          img.src =
            reader.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "File read failed"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

  }

/* =========================

========================= */

async function loadProfile(){

  try{

    const userRef =
      doc(
        db,
        "users",
        userId
      );


    const snap =
      await getDoc(
        userRef
      );


    if(snap.exists()){

      const data =
        snap.data();


      /* PROFILE NAME */

      profileName.textContent =
        data.full_name ||
        "Carpenter";


      /* USERNAME */

      profileUsername.textContent =
        "@" +
        (
          data.username ||
          "carpenter"
        );


      /* BIO */

      profileBio.textContent =
        data.bio ||
        "Carpenter Community Member";


      /* LOCATION */

      profileLocation.textContent =
        data.location
        ? "📍 " + data.location
        : "📍 Location not added";


      /* PHOTO */

      if(data.photo_url){

        profilePhoto.src =
          data.photo_url;

      }
      else{

        profilePhoto.src =
          defaultPhoto;

      }


      /* =========================
         EDIT FORM VALUES
      ========================= */

      nameInput.value =
        data.full_name ||
        "";


      usernameInput.value =
        data.username ||
        "";


      bioInput.value =
        data.bio ||
        "";


      locationInput.value =
        data.location ||
        "";

    }
    else{

      /* NEW PROFILE */

      profilePhoto.src =
        defaultPhoto;


      nameInput.value =
        "Carpenter";


      usernameInput.value =
        "carpenter";


      bioInput.value =
        "Carpenter Community Member";


      locationInput.value =
        "";

    }


    /* LOAD COUNTS */

    await loadStats();


    /* LOAD POSTS */

    await loadUserPosts();


    /* FOLLOW STATUS */

    await checkFollowStatus();

  }
  catch(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );

    showMessage(
      "❌ Profile load नहीं हुई"
    );

  }

}

async function loadStats(){

  try{

    const followersRef =
      collection(

        "followers"
      );


    const followingRef =
      collection(
        db,

    const followersSnapshot =
      await getDocs(
        followersRef
      );


    const followingSnapshot =
      await getDocs(
        followingRef
      );


    followersCount.textContent =
      followersSnapshot.size;


    followingCount.textContent =
      followingSnapshot.size;

  }
  catch(error){

    console.error(
      "STATS ERROR:",
      error
    );

  }

}


/* =========================
   LOAD USER POSTS
========================= */

async function loadUserPosts(){

  try{

    const postsRef =
      collection(
        db,
        "community_posts"
      );


    const q =
      query(
        postsRef,
        where(
          "user_id",
          "==",
          userId
        )
      );


    const snapshot =
      await getDocs(q);


    postsCount.textContent =
      snapshot.size;


    if(snapshot.empty){

      userPosts.innerHTML = `

        <div class="empty">

          📸

          <p style="margin-top:8px;">
            अभी कोई Post नहीं है।
          </p>

        </div>

      `;

      return;

    }


    userPosts.innerHTML =
      "";


    snapshot.forEach(
      function(postDoc){

        const post =
          postDoc.data();


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "post-card";


        /* POST TEXT */

        if(post.post_text){

          const text =
            document.createElement(
              "div"
            );


          text.className =
            "post-text";


          text.textContent =
            post.post_text;


          card.appendChild(
            text
          );

        }


        /* POST IMAGE */

        if(post.image_url){

          const image =
            document.createElement(
              "img"
            );


          image.className =
            "post-image";


          image.src =
            post.image_url;


          image.alt =
            "Carpenter Post";


          image.loading =
            "lazy";


          card.appendChild(
            image
          );

        }


        userPosts.appendChild(
          card
        );

      }
    );

  }
  catch(error){

    console.error(
      "POSTS ERROR:",
      error
    );


    userPosts.innerHTML = `

      <div class="empty">

        ⚠️

        <p style="margin-top:8px;">
          Posts load नहीं हो सके।
        </p>

      </div>

    `;

  }

}

/* =========================
   CHECK FOLLOW STATUS
========================= */

async function checkFollowStatus(){

  try{

    const myFollowingRef =
      doc(
        db,
        "users",
        userId,
        "following",
        userId
      );


    const snap =
      await getDoc(
        myFollowingRef
      );


    /*
     * अपने ही Profile पर Follow
     * नहीं दिखाना
     */

    if(userId){

      followBtn.style.display =
        "inline-block";

    }


    if(snap.exists()){

      followBtn.textContent =
        "✓ Following";

      followBtn.classList.add(
        "following"
      );

    }
    else{

      followBtn.textContent =
        "➕ Follow";

      followBtn.classList.remove(
        "following"
      );

    }

  }
  catch(error){

    console.error(
      "FOLLOW STATUS ERROR:",
      error
    );

  }

}

/* =========================
   MESSAGE
========================= */

function showMessage(text){

  message.textContent =
    text;


  message.style.display =
    "block";


  setTimeout(
    function(){

      message.style.display =
        "none";

    },
    3000
  );

}
