const pageParams = new URLSearchParams(
  window.location.search
);

const targetProfileId =
  pageParams.get("userId") || userId;


/* =========================================================
   PROFILE DATA LOAD
========================================================= */

async function loadProfileData(){

  try{

    const profileRef = doc(
      db,
      "users",
      targetProfileId
    );

    const profileSnap =
      await getDoc(profileRef);

    if(!profileSnap.exists()){

      showMessage(
        "❌ Profile नहीं मिला"
      );

      return null;
    }

    const data =
      profileSnap.data();

    currentProfileData =
      data;

    return data;

  }
  catch(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );

    showMessage(
      "❌ Profile load नहीं हो पाया"
    );

    return null;
  }

}


/* =========================================================
   CHECK FOLLOW STATUS
========================================================= */

async function getFollowStatus(){

  try{

    /* अपना profile */

    if(targetProfileId === userId){

      return false;
    }


    const followingRef =
      doc(
        db,
        "users",
        userId,
        "following",
        targetProfileId
      );


    const followingSnap =
      await getDoc(
        followingRef
      );


    return followingSnap.exists();

  }
  catch(error){

    console.error(
      "CHECK FOLLOW ERROR:",
      error
    );

    return false;
  }

}


/* =========================================================
   UPDATE FOLLOW BUTTON
========================================================= */

async function refreshFollowButton(){

  const button =
    document.getElementById(
      "followBtn"
    );


  if(!button){

    return;
  }


  /* अपना profile */

  if(targetProfileId === userId){

    button.textContent =
      "👤 Your Profile";

    button.disabled =
      true;

    button.style.opacity =
      "0.6";

    return;
  }


  button.disabled =
    true;


  const isFollowing =
    await getFollowStatus();


  if(isFollowing){

    button.textContent =
      "✓ Following";

    button.classList.add(
      "following"
    );

  }
  else{

    button.textContent =
      "➕ Follow";

    button.classList.remove(
      "following"
    );

  }


  button.disabled =
    false;

}


/* =========================================================
   FOLLOW USER
========================================================= */

async function doFollow(){

  if(!userId){

    showMessage(
      "❌ Login जरूरी है"
    );

    return;
  }


  if(!targetProfileId){

    showMessage(
      "❌ Profile ID नहीं मिली"
    );

    return;
  }


  if(targetProfileId === userId){

    showMessage(
      "आप अपने ही profile को Follow नहीं कर सकते"
    );

    return;
  }


  const button =
    document.getElementById(
      "followBtn"
    );


  if(button){

    button.disabled =
      true;

    button.textContent =
      "⏳ Following...";
  }


  try{

    /* =====================================================
       TARGET USER → FOLLOWERS
    ===================================================== */

    const followerRef =
      doc(
        db,
        "users",
        targetProfileId,
        "followers",
        userId
      );


    await setDoc(
      followerRef,
      {

        user_id:
          userId,

        created_at:
          serverTimestamp()

      }
    );


    /* =====================================================
       CURRENT USER → FOLLOWING
    ===================================================== */

    const followingRef =
      doc(
        db,
        "users",
        userId,
        "following",
        targetProfileId
      );


    await setDoc(
      followingRef,
      {

        user_id:
          targetProfileId,

        created_at:
          serverTimestamp()

      }
    );


    showMessage(
      "✅ Follow किया गया"
    );


    await refreshFollowButton();


    if(
      typeof loadStats ===
      "function"
    ){

      await loadStats();

    }

  }
  catch(error){

    console.error(
      "FOLLOW ERROR:",
      error
    );


    showMessage(
      "❌ Follow करने में समस्या हुई"
    );


    if(button){

      button.disabled =
        false;

    }

  }

}


/* =========================================================
   UNFOLLOW USER
========================================================= */

async function doUnfollow(){

  if(!userId){

    showMessage(
      "❌ Login जरूरी है"
    );

    return;
  }


  if(!targetProfileId){

    return;
  }


  const button =
    document.getElementById(
      "followBtn"
    );


  if(button){

    button.disabled =
      true;

    button.textContent =
      "⏳ Unfollowing...";
  }


  try{

    /* =====================================================
       REMOVE FROM TARGET FOLLOWERS
    ===================================================== */

    const followerRef =
      doc(
        db,
        "users",
        targetProfileId,
        "followers",
        userId
      );


    await deleteDoc(
      followerRef
    );


    /* =====================================================
       REMOVE FROM CURRENT USER FOLLOWING
    ===================================================== */

    const followingRef =
      doc(
        db,
        "users",
        userId,
        "following",
        targetProfileId
      );


    await deleteDoc(
      followingRef
    );


    showMessage(
      "✅ Unfollow किया गया"
    );


    await refreshFollowButton();


    if(
      typeof loadStats ===
      "function"
    ){

      await loadStats();

    }

  }
  catch(error){

    console.error(
      "UNFOLLOW ERROR:",
      error
    );


    showMessage(
      "❌ Unfollow करने में समस्या हुई"
    );


    if(button){

      button.disabled =
        false;

    }

  }

}

}

    /* =====================================================

const profileUserId =
  new URLSearchParams(
    window.location.search
  ).get("userId") || userId;


/* =====================================================
   CHECK FOLLOW STATUS
===================================================== */

async function checkFollowStatus(){

  try{

    /* अपनी Profile */
    if(profileUserId === userId){

      followBtn.textContent =
        "👤 Your Profile";

      followBtn.disabled =
        true;

      followBtn.style.opacity =
        "0.6";

      return;
    }


    /* Target user के followers में
       current user की ID */
    const followerRef =
      doc(
        db,
        "users",
        profileUserId,
        "followers",
        userId
      );


    const followerSnap =
      await getDoc(
        followerRef
      );


    if(followerSnap.exists()){

      followBtn.textContent =
        "✓ Following";

      followBtn.classList.add(
        "following"
      );

    }
    else{

      followBtn.textContent =
        "➕ Follow";

      followBtn.classList.remove(
        "following"
      );

    }

  }
  catch(error){

    console.error(
      "FOLLOW STATUS ERROR:",
      error
    );

  }

}


/* =====================================================
   FOLLOW / UNFOLLOW BUTTON
===================================================== */

followBtn.addEventListener(
  "click",
  async function(){

    /* अपनी Profile पर Follow नहीं */
    if(profileUserId === userId){

      showMessage(
        "यह आपकी अपनी Profile है"
      );

      return;
    }


    followBtn.disabled =
      true;

    followBtn.textContent =
      "⏳ Please wait...";


    try{

      /* =========================
         FOLLOWER ENTRY
      ========================= */

      const followerRef =
        doc(
          db,
          "users",
          profileUserId,
          "followers",
          userId
        );


      /* =========================
         FOLLOWING ENTRY
      ========================= */

      const followingRef =
        doc(
          db,
          "users",
          userId,
          "following",
          profileUserId
        );


      /* पहले check करें */
      const existingFollow =
        await getDoc(
          followerRef
        );


      /* =========================
         UNFOLLOW
      ========================= */

      if(existingFollow.exists()){

        await deleteDoc(
          followerRef
        );

        await deleteDoc(
          followingRef
        );


        followBtn.textContent =
          "➕ Follow";

        followBtn.classList.remove(
          "following"
        );


        showMessage(
          "✓ Unfollow कर दिया"
        );

      }


      /* =========================
         FOLLOW
      ========================= */

      else{

        await setDoc(
          followerRef,
          {
            user_id:
              userId,

            followed_user_id:
              profileUserId,

            created_at:
              serverTimestamp()
          }
        );


        await setDoc(
          followingRef,
          {
            user_id:
              userId,

            following_user_id:
              profileUserId,

            created_at:
              serverTimestamp()
          }
        );


        followBtn.textContent =
          "✓ Following";

        followBtn.classList.add(
          "following"
        );


        showMessage(
          "❤️ Following"
        );

      }


      /* =========================
         REFRESH COUNTS
      ========================= */

      await loadStats();


      /* =========================
         REFRESH BUTTON
      ========================= */

      await checkFollowStatus();

    }
    catch(error){

      console.error(
        "FOLLOW ERROR:",
        error
      );


      showMessage(
        "❌ Follow नहीं हो पाया: " +
        (
          error.message ||
          "Unknown error"
        )
      );


      await checkFollowStatus();

    }
    finally{

      if(profileUserId !== userId){

        followBtn.disabled =
          false;

      }

    }

  }
);
