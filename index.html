<style>

:root{

*{

}

html{

}

body{

}

}

}

.light{

}

}

.nav{
  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

.brand{

  font-size:20px;
  font-weight:850;
}

.logo{

  color:#fff;

  place-items:center;

  font-weight:900;
}

.links{

  gap:28px;

  font-size:14px;
  font-weight:650;

  color:#344054;
}

.links a:hover{

}

.actions{
  display:flex;
  gap:9px;
}

.hero{

  display:grid;

    1.08fr .92fr;

  align-items:center;

.tag{
  display:inline-flex;

  gap:8px;

  align-items:center;

  padding:7px 11px;

  border-radius:999px;

  background:#eef4ff;

  color:var(--p);

  font-size:13px;
  font-weight:800;

  margin-bottom:18px;
}

  width:8px;
  height:8px;

  border-radius:50%;

  background:#12a150;
}

h1{
  font-size:

  line-height:1.04;

  letter-spacing:-2px;

  margin-bottom:18px;

.hero p{
  font-size:18px;

  color:var(--muted);

  max-width:650px;
}

.hero-buttons{
  display:flex;

  gap:12px;

  margin-top:28px;

  flex-wrap:wrap;
}

.trust{
  display:flex;

  gap:25px;

  flex-wrap:wrap;

  margin-top:30px;

  color:#475467;

  font-size:13px;
}

.trust strong{
  display:block;

  color:var(--ink);

  font-size:18px;
}

.hero-card{
  background:#fff;

  border:
    1px solid var(--line);

  border-radius:24px;

  padding:22px;

  box-shadow:var(--shadow);
}

.hero-photo{
  height:270px;

  border-radius:18px;

  background:

      135deg,
      #dce9ff,
      #eef2f7

  display:grid;

  place-items:center;

  position:relative;
}

.tool{
  font-size:82px;
}

.verified{
  position:absolute;

  left:15px;
  bottom:15px;

  background:#fff;

  border-radius:12px;

  padding:10px 13px;

  box-shadow:

  font-size:13px;

  font-weight:800;
}

.rating{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding-top:18px;

.stars{
  color:#f59e0b;

  font-weight:800;

<script>

"use strict";


/* =====================================================
   CURRENT YEAR
===================================================== */

const yearElement =
  document.getElementById(
    "currentYear"
  );

if(yearElement){

  yearElement.textContent =
    new Date().getFullYear();

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  if(!toast){
    return;
  }

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      3500
    );

}


window.showToast =
  showToast;


/* =====================================================
   BOOKING MODAL
===================================================== */

window.openBooking =
function(service){

  const modal =
    document.getElementById(
      "bookingModal"
    );

  if(!modal){
    return;
  }


  const serviceInput =
    document.getElementById(
      "quickService"
    );


  if(serviceInput && service){

    const options =
      Array.from(
        serviceInput.options
      );

    const found =
      options.find(
        function(option){

          return (
            option.value ===
            service
          );

        }
      );


    if(found){

      serviceInput.value =
        service;

    }

  }


  modal.classList.add(
    "active"
  );

  modal.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.classList.add(
    "modal-open"
  );


  setTimeout(
    function(){

      const name =
        document.getElementById(
          "quickName"
        );

      if(name){
        name.focus();
      }

    },
    150
  );

};


/* =====================================================
   CLOSE BOOKING
===================================================== */

window.closeBooking =
function(){

  const modal =
    document.getElementById(
      "bookingModal"
    );

  if(!modal){
    return;
  }


  modal.classList.remove(
    "active"
  );

  modal.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.classList.remove(
    "modal-open"
  );

};


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeBooking();

    }

  }
);


/* =====================================================
   MAIN BOOKING FORM
===================================================== */

window.submitBooking =
function(event){

  event.preventDefault();


  const name =
    document.getElementById(
      "customerName"
    )?.value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    )?.value.trim();


  const service =
    document.getElementById(
      "customerService"
    )?.value;


  const address =
    document.getElementById(
      "customerAddress"
    )?.value.trim();


  const status =
    document.getElementById(
      "bookingStatus"
    );


  if(
    !name ||
    !phone ||
    !service ||
    !address
  ){

    if(status){

      status.textContent =
        "कृपया सभी जानकारी भरें।";

    }

    return;

  }


  if(!/^[0-9]{10}$/.test(phone)){

    if(status){

      status.textContent =
        "कृपया सही 10 digit mobile number डालें।";

    }

    return;

  }


  const message =
    encodeURIComponent(
      "नमस्ते Anil Carpenter,\n\n" +
      "मुझे Carpenter Service चाहिए।\n\n" +
      "नाम: " + name + "\n" +
      "मोबाइल: " + phone + "\n" +
      "Service: " + service + "\n" +
      "Address: " + address
    );


  const whatsappURL =
    "https://wa.me/918341188318?text=" +
    message;


  if(status){

    status.textContent =
      "Request तैयार है...";

  }


  window.open(
    whatsappURL,
    "_blank"
  );

};


/* =====================================================
   QUICK BOOKING
===================================================== */

window.submitQuickBooking =
function(event){

  event.preventDefault();


  const name =
    document.getElementById(
      "quickName"
    )?.value.trim();


  const phone =
    document.getElementById(
      "quickPhone"
    )?.value.trim();


  const service =
    document.getElementById(
      "quickService"
    )?.value;


  const address =
    document.getElementById(
      "quickAddress"
    )?.value.trim();


  const extraMessage =
    document.getElementById(
      "quickMessage"
    )?.value.trim();


  const status =
    document.getElementById(
      "quickBookingStatus"
    );


  if(
    !name ||
    !phone ||
    !service ||
    !address
  ){

    if(status){

      status.textContent =
        "कृपया सभी जरूरी जानकारी भरें।";

    }

    return;

  }


  if(!/^[0-9]{10}$/.test(phone)){

    if(status){

      status.textContent =
        "कृपया सही 10 digit mobile number डालें।";

    }

    return;

  }


  const whatsappText =
    "नमस्ते Anil Carpenter,\n\n" +
    "मुझे Carpenter Service book करनी है।\n\n" +
    "नाम: " + name + "\n" +
    "मोबाइल: " + phone + "\n" +
    "Service: " + service + "\n" +
    "Address: " + address +
    (
      extraMessage
      ?
      "\nकाम की जानकारी: " +
      extraMessage
      :
      ""
    );


  const whatsappURL =
    "https://wa.me/918341188318?text=" +
    encodeURIComponent(
      whatsappText
    );


  if(status){

    status.textContent =
      "WhatsApp खोला जा रहा है...";

  }


  window.open(
    whatsappURL,
    "_blank"
  );


  setTimeout(
    function(){

      closeBooking();

    },
    500
  );

};


/* =====================================================
   SMOOTH SCROLL
===================================================== */

document
  .querySelectorAll(
    'a[href^="#"]'
  )
  .forEach(
    function(link){

      link.addEventListener(
        "click",
        function(event){

          const id =
            this.getAttribute(
              "href"
            );


          if(
            !id ||
            id === "#"
          ){

            return;

          }


          const target =
            document.querySelector(
              id
            );


          if(target){

            event.preventDefault();

            target.scrollIntoView({
              behavior:
                "smooth",
              block:
                "start"
            });

          }

        }
      );

    }
  );


/* =====================================================
   BACK TO TOP VISIBILITY
===================================================== */

const backToTop =
  document.getElementById(
    "backToTop"
  );


window.addEventListener(
  "scroll",
  function(){

    if(!backToTop){
      return;
    }


    if(
      window.scrollY >
      500
    ){

      backToTop.classList.add(
        "show"
      );

    }else{

      backToTop.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   PHONE NUMBER ONLY
===================================================== */

document.addEventListener(
  "input",
  function(event){

    if(
      event.target.matches(
        'input[type="tel"]'
      )
    ){

      event.target.value =
        event.target.value
          .replace(
            /[^0-9]/g,
            ""
          )
          .slice(
            0,
            10
          );

    }

  }
);

</script>
