<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Carpenter Profile | Anil Carpenter</title>

<meta
name="description"
content="Carpenter Community में Carpenter Profile देखें और सीधे WhatsApp पर संपर्क करें।">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f7fa;
  color:#202124;
  line-height:1.6;
}

.container{
  width:92%;
  max-width:850px;
  margin:auto;
}


/* =========================
   HEADER
========================= */

.header{
  background:#111827;
  color:#fff;
  padding:15px 0;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:20px;
  font-weight:700;
}

.logo span{
  color:#f59e0b;
}

.back{
  color:#fff;
  text-decoration:none;
  border:1px solid #4b5563;
  padding:8px 13px;
  border-radius:8px;
  font-size:13px;
}


/* =========================
   LOADING
========================= */

.loading{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#6b7280;
  padding:30px;
}


/* =========================
   PROFILE HERO
========================= */

.profile-section{
  padding:45px 0 70px;
}

.profile-card{
  background:#fff;
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  overflow:hidden;
  border:1px solid #e5e7eb;
}

.profile-cover{
  height:150px;
  background:linear-gradient(
    135deg,
    #111827,
    #374151
  );
}

.profile-main{
  padding:0 28px 30px;
}

.profile-photo{
  width:120px;
  height:120px;
  border-radius:50%;
  background:linear-gradient(
    135deg,
    #fff3cd,
    #fde68a
  );
  border:6px solid #fff;
  margin-top:-60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  overflow:hidden;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:30px;
  font-weight:800;
  margin-top:15px;
}

.location{
  color:#6b7280;
  margin-top:4px;
}

.verified{
  display:inline-block;
  color:#15803d;
  font-weight:700;
  font-size:13px;
  margin-top:5px;
}


/* =========================
   BADGES
========================= */

.badges{
  margin:20px 0;
}

.badge{
  display:inline-block;
  background:#f3f4f6;
  color:#374151;
  padding:7px 11px;
  border-radius:20px;
  font-size:13px;
  margin:3px;
}


/* =========================
   ABOUT
========================= */

.about{
  border-top:1px solid #e5e7eb;
  padding-top:22px;
  margin-top:20px;
}

.about h2{
  font-size:20px;
  margin-bottom:8px;
}

.about p{
  color:#4b5563;
}


/* =========================
   INFO GRID
========================= */

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:25px;
}

.info-box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
}

.info-label{
  font-size:12px;
  color:#6b7280;
}

.info-value{
  font-weight:700;
  margin-top:3px;
}


/* =========================
   BUTTONS
========================= */

.buttons{
  display:flex;
  gap:12px;
  margin-top:28px;
}

.buttons a,
.buttons button{
  flex:1;
  border:0;
  padding:14px;
  border-radius:10px;
  text-align:center;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.whatsapp{
  background:#22c55e;
  color:#fff;
}

.call{
  background:#111827;
  color:#fff;
}

.share{
  background:#f59e0b;
  color:#111827;
}


/* =========================
   SKILLS
========================= */

.skills{
  margin-top:25px;
}

.skills h2{
  font-size:20px;
  margin-bottom:10px;
}


/* =========================
   FOOTER
========================= */

.footer{
  background:#0b1120;
  color:#9ca3af;
  text-align:center;
  padding:25px 15px;
  font-size:13px;
}


/* =========================
   ERROR
========================= */

.error{
  text-align:center;
  padding:80px 20px;
}

.error-icon{
  font-size:50px;
  margin-bottom:10px;
}

.error h2{
  margin-bottom:8px;
}

.error p{
  color:#6b7280;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .logo{
    font-size:17px;
  }

  .back{
    font-size:12px;
    padding:7px 10px;
  }

  .profile-section{
    padding:25px 0 50px;
  }

  .profile-main{
    padding:0 20px 25px;
  }

  .profile-cover{
    height:120px;
  }

  .profile-photo{
    width:105px;
    height:105px;
    margin-top:-52px;
    font-size:48px;
  }

  .profile-name{
    font-size:25px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .buttons{
    flex-direction:column;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

<div class="container header-inner">

<a
href="index.html"
class="logo">

🪚 <span>Anil</span> Carpenter

</a>

<a
href="carpenter-directory.html"
class="back">

← Directory

</a>

</div>

</header>



<!-- =========================
     PROFILE AREA
========================= -->

<main>

<section class="profile-section">

<div class="container">

<div
id="profileContainer"
class="loading">

<div>

<div style="font-size:40px;">
⏳
</div>

<p>
Carpenter Profile लोड हो रही है...
</p>

</div>

</div>

</div>

</section>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

<p>
© 2026 Anil Carpenter • Carpenter Community
</p>

</footer>



<script>


/* =========================
   GOOGLE APPS SCRIPT
========================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzTXG6UJfx1QYN_azzEK8eq2EM9W8f0thNEuynzqvvK33DN_dJV_VIW3SK6btw1UtU/exec";


/* =========================
   GET PROFILE NAME
========================= */

 function getProfileName(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("name") ||
    params.get("mobile") ||
    ""
  ).trim();

 }

}


/* =========================
   LOAD DATA
========================= */

async function loadProfile(){

  const container =
    document.getElementById(
      "profileContainer"
    );

  const profileName =
  getProfileName();

if(!profileName){

  showError(
    "Carpenter Profile नहीं मिला",
    "Profile link में Carpenter की जानकारी मौजूद नहीं है।"
  );

  return;

}

  }


  try{

    const response =
      await fetch(SCRIPT_URL);


    if(!response.ok){

      throw new Error(
        "Network error"
      );

    }


    const data =
      await response.json();


    let rows =
      Array.isArray(data)
      ? data
      : (
        Array.isArray(data.data)
        ? data.data
        : []
      );


    /*
      Google Sheet Array को Object में बदलना
    */

    if(
      rows.length &&
      Array.isArray(rows[0])
    ){

      rows =
        rows.map(function(row){

          return {

            Name:
              row[0] || "",

            Mobile:
              row[1] || "",

            City:
              row[2] || "",

            Experience:
              row[3] || "",

            Work:
              row[4] || "",

            About:
              row[5] || "",

            WhatsApp:
              row[6] || row[1] || "",

            Purpose:
              row[7] || ""

          };

        });

    }


    /*
      Carpenter खोजें
    */

    const person =
  rows.find(function(item){

    const name =
      item.Name ||
      item.name ||
      "";

    const mobile =
      item.Mobile ||
      item.mobile ||
      "";

    const searchValue =
      profileName
      .replace(/\D/g,"");

    const sheetMobile =
      String(mobile)
      .replace(/\D/g,"");

    const nameMatch =
      String(name)
      .trim()
      .toLowerCase()
      ===
      profileName
      .trim()
      .toLowerCase();

    const mobileMatch =
      sheetMobile === searchValue ||
      sheetMobile ===
      ("91" + searchValue);

    return nameMatch || mobileMatch;

  });


    if(!person){

      showError(
        "Carpenter नहीं मिला",
        "यह Carpenter अभी Directory में उपलब्ध नहीं है।"
      );

      return;

    }


    displayProfile(person);

  }


  catch(error){

    console.error(error);

    showError(
      "Profile Load नहीं हो सकी",
      "कृपया कुछ देर बाद दोबारा कोशिश करें।"
    );

  }

}


/* =========================
   DISPLAY PROFILE
========================= */

function displayProfile(person){

  const container =
    document.getElementById(
      "profileContainer"
    );


  const name =
    person.Name ||
    person.name ||
    "Carpenter";


  const mobile =
    person.Mobile ||
    person.mobile ||
    "";


  const city =
    person.City ||
    person.city ||
    "स्थान उपलब्ध नहीं";


  const experience =
    person.Experience ||
    person.experience ||
    "अनुभव उपलब्ध नहीं";


  const work =
    person.Work ||
    person.work ||
    "Carpenter";


  const about =
    person.About ||
    person.about ||
    "Carpenter Community Member";


  const whatsapp =
    person.WhatsApp ||
    person.whatsapp ||
    mobile;


  const whatsappNumber =
    String(whatsapp)
    .replace(/\D/g,"");


  let whatsappLink =
    "";


  if(whatsappNumber){

    let number =
      whatsappNumber;

    if(number.length === 10){

      number =
        "91" + number;

    }

    whatsappLink =
      "https://wa.me/" +
      number;

  }


  const phoneLink =
    mobile
    ? "tel:" +
      String(mobile)
      .replace(/\D/g,"")
    : "#";


  /*
    Share URL
  */

  const shareURL =
    window.location.origin +
    window.location.pathname +
    "?name=" +
    encodeURIComponent(name);


  document.title =
    name +
    " | Carpenter Profile | Anil Carpenter";


  container.className =
    "profile-card";


  container.innerHTML = `

    <div class="profile-cover">
    </div>


    <div class="profile-main">


      <div class="profile-photo">

        👷

      </div>


      <div class="profile-name">

        ${escapeHTML(name)}

      </div>


      <div class="location">

        📍 ${escapeHTML(city)}

      </div>


      <div class="verified">

        ✓ Community Member

      </div>


      <div class="badges">

        <span class="badge">

          ⭐ ${escapeHTML(experience)}

        </span>


        <span class="badge">

          🛠️ ${escapeHTML(work)}

        </span>

      </div>


      <div class="about">

        <h2>
          👤 About Carpenter
        </h2>

        <p>

          ${escapeHTML(about)}

        </p>

      </div>


      <div class="info-grid">


        <div class="info-box">

          <div class="info-label">
            📍 Location
          </div>

          <div class="info-value">

            ${escapeHTML(city)}

          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            ⭐ Experience
          </div>

          <div class="info-value">

            ${escapeHTML(experience)}

          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            🛠️ Main Work
          </div>

          <div class="info-value">

            ${escapeHTML(work)}

          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            📱 Mobile
          </div>

          <div class="info-value">

            ${escapeHTML(
              mobile ||
              "उपलब्ध नहीं"
            )}

          </div>

        </div>


      </div>


      <div class="skills">

        <h2>
          🛠️ Skills & Work
        </h2>

        <span class="badge">
          ${escapeHTML(work)}
        </span>

      </div>


      <div class="buttons">


        ${
          whatsappLink
          ?
          `
          <a
            href="${whatsappLink}"
            target="_blank"
            rel="noopener"
            class="whatsapp">

            💬 WhatsApp

          </a>
          `
          :
          `
          <a
            href="#"
            class="whatsapp"
            style="opacity:.5;">

            WhatsApp

          </a>
          `
        }


        ${
          mobile
          ?
          `
          <a
            href="${phoneLink}"
            class="call">

            📞 Call

          </a>
          `
          :
          ""
        }


        <button
          type="button"
          class="share"
          onclick="shareProfile(
            '${escapeJS(name)}'
          )">

          🔗 Share

        </button>


      </div>


    </div>

  `;


  /*
    Browser Share
  */

  window.currentProfileURL =
    shareURL;

}


/* =========================
   SHARE PROFILE
========================= */

async function shareProfile(name){

  const url =
    window.currentProfileURL ||
    window.location.href;


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          name +
          " | Carpenter Profile",

        text:
          "Carpenter Community पर " +
          name +
          " की Profile देखें।",

        url:url

      });

    }

    catch(error){

      console.log(
        "Share cancelled"
      );

    }

  }

  else{

    try{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Profile link copy हो गया।"
      );

    }

    catch(error){

      prompt(
        "Profile Link:",
        url
      );

    }

  }

}


/* =========================
   ERROR
========================= */

function showError(
  title,
  message
){

  const container =
    document.getElementById(
      "profileContainer"
    );


  container.className =
    "error";


  container.innerHTML = `

    <div class="error-icon">
      🔎
    </div>

    <h2>
      ${escapeHTML(title)}
    </h2>

    <p>
      ${escapeHTML(message)}
    </p>

    <br>

    <a
      href="carpenter-directory.html"
      style="
        display:inline-block;
        background:#111827;
        color:#fff;
        padding:11px 18px;
        border-radius:9px;
        text-decoration:none;
        font-weight:700;
      ">

      ← Directory पर वापस जाएँ

    </a>

  `;

}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   SAFE JS
========================= */

function escapeJS(value){

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r?\n/g,
      "\\n"
    );

}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadProfile();

  }
);

</script>

</body>

  </html>
