<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - पेज नहीं मिला | Anil Carpenter</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #fff;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            text-decoration: none;
        }
        .links a {
            margin-left: 20px;
            text-decoration: none;
            color: #555;
            font-weight: 500;
        }
        .links a:hover {
            color: #2563eb;
        }
        .error-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }
        .error-card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
            margin: 0 0 10px 0;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
        }
        .error-desc {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 28px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover {
            background-color: #1d4ed8;
        }
        footer {
            background: #fff;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav">
            <a href="index.html" class="logo">Anil Carpenter</a>
            <nav class="links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="blog.html">Blog</a>
            </nav>
        </div>
    </header>

    <main class="error-content">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">पेज नहीं मिला (Page Not Found)</h1>
            <p class="error-desc">आप जिस पेज को खोज रहे हैं वह हटा दिया गया है, उसका नाम बदल दिया गया है या वह अस्थायी रूप से अनुपलब्ध है।</p>
            <a href="index.html" class="btn-home">होमपेज पर जाएं →</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 Anil Carpenter. Vadodara & Uttar Pradesh Services.</p>
        </div>
    </footer>

</body>
</html>
