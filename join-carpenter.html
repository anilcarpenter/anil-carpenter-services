<form id="carpenterForm">

  <input type="text" name="Name" placeholder="आपका नाम" required>

  <input type="tel" name="Mobile" placeholder="मोबाइल नंबर" required>

  <input type="text" name="City" placeholder="शहर / जिला" required>

  <input type="text" name="Experience" placeholder="अनुभव">

  <input type="text" name="Work" placeholder="आप कौन सा काम करते हैं?">

  <textarea name="About" placeholder="अपने बारे में"></textarea>

  <input type="tel" name="WhatsApp" placeholder="WhatsApp नंबर">

  <input type="text" name="Profile" placeholder="Profile / फोटो लिंक">

  <button type="submit">
    🪚 Carpenter Community में जुड़ें
  </button>

</form>

<p id="formMessage"></p>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbxRNh2OE_T59rNDDFZtbwbYjzVYOxYcPwcBsr6QrQG46FE9COuiaQhucSyRNS4pLmYd9A/exec";

document.getElementById("carpenterForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const form = this;
  const message = document.getElementById("formMessage");

  message.textContent = "⏳ जानकारी भेजी जा रही है...";

  fetch(scriptURL, {
    method: "POST",
    body: new URLSearchParams(new FormData(form))
  })
  .then(response => response.text())
  .then(() => {
    message.textContent = "✅ आपका Carpenter Profile सफलतापूर्वक जुड़ गया!";
    form.reset();
  })
  .catch(() => {
    message.textContent = "❌ जानकारी भेजने में समस्या हुई।";
  });

});

</script>
